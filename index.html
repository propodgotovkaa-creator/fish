<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Весёлая рыбалка</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #063951;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #194965;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;
  isolation: isolate;

  transform-origin: top left;

  background: #148aaf;
}

/* =====================================================
   ФОН
===================================================== */

#background {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 0;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ВОЛНЫ
===================================================== */

.wave-track {
  position: absolute;
  left: 0;

  width: 200%;
  height: 210px;

  display: flex;

  pointer-events: none;

  will-change: transform;
}

.wave-track img {
  display: block;

  width: 50%;
  height: 100%;

  flex: 0 0 50%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}

#wavesBack {
  top: 325px;

  z-index: 2;

  opacity: .60;

  animation:
    wavesBackMove 18s linear infinite,
    wavesBackBob 4s ease-in-out infinite;
}

#wavesFront {
  top: 350px;

  z-index: 8;

  opacity: .82;

  animation:
    wavesFrontMove 12s linear infinite,
    wavesFrontBob 3s ease-in-out infinite;
}

@keyframes wavesBackMove {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

@keyframes wavesFrontMove {
  from {
    transform: translateX(-50%);
  }

  to {
    transform: translateX(0);
  }
}

@keyframes wavesBackBob {
  0%,
  100% {
    margin-top: 0;
  }

  50% {
    margin-top: 8px;
  }
}

@keyframes wavesFrontBob {
  0%,
  100% {
    margin-top: 0;
  }

  50% {
    margin-top: -7px;
  }
}

/* =====================================================
   ПАНЕЛЬ
===================================================== */

header {
  position: absolute;

  top: 30px;
  left: 42px;
  right: 42px;

  z-index: 20;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  pointer-events: none;
}

.title-card {
  padding: 20px 30px;

  border: 2px solid #ffffffb3;
  border-radius: 30px;

  background:
    linear-gradient(
      135deg,
      #fffffff2,
      #effbffe0
    );

  box-shadow:
    0 10px 30px #1354711c;
}

h1 {
  margin: 0 0 7px;
  font-size: 41px;
  letter-spacing: -.7px;
}

.subtitle {
  margin: 0;
  font-size: 23px;
}

.subtitle strong {
  display: inline-grid;
  place-items: center;

  width: 35px;
  height: 35px;

  margin-left: 4px;

  border-radius: 10px;

  background: #ffdc7e;

  color: #755022;
}

.score-card {
  min-width: 192px;

  padding: 18px 25px;

  border: 2px solid #ffffffb3;
  border-radius: 28px;

  background: #ffffffed;

  box-shadow:
    0 10px 30px #1354711c;
}

.score-label {
  margin-bottom: 7px;

  color: #618293;

  font-size: 17px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

#score {
  font-size: 35px;
  font-weight: bold;
}

.progress {
  height: 9px;

  margin-top: 13px;

  overflow: hidden;

  border-radius: 10px;

  background: #dfedf0;
}

#progressFill {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #35b9ba,
      #80d7a2
    );

  transition: width .4s ease;
}

/* =====================================================
   МАЛЬЧИК + ЛОДКА
===================================================== */

#boat {
  position: absolute;

  left: 625px;
  top: 40px;

  width: 670px;

  z-index: 7;

  pointer-events: none;

  transform-origin: 50% 75%;

  will-change: transform;
}

#boyBase {
  display: block;

  width: 100%;
  height: auto;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ТЕНЬ ЛОДКИ
===================================================== */

#boatShadow {
  position: absolute;

  left: 685px;
  top: 370px;

  width: 550px;
  height: 25px;

  border-radius: 50%;

  background: #075e7938;

  filter: blur(8px);

  z-index: 3;

  pointer-events: none;
}

/* =====================================================
   УДОЧКА
===================================================== */

#tackle {
  position: absolute;

  inset: 0;

  width: 1920px;
  height: 1080px;

  z-index: 11;

  overflow: visible;

  pointer-events: none;
}

#rod {
  fill: none;

  stroke: #73472c;
  stroke-width: 7;

  stroke-linecap: round;
}

#rodLight {
  fill: none;

  stroke: #d7a05c;
  stroke-width: 2.5;

  stroke-linecap: round;
}

#rodHandle {
  stroke: #3d4248;
  stroke-width: 12;

  stroke-linecap: round;
}

#line {
  fill: none;

  stroke: #ffffffdf;
  stroke-width: 2.4;

  stroke-linecap: round;
}

#hook {
  fill: none;

  stroke: #dce9ee;
  stroke-width: 5;

  stroke-linecap: round;
  stroke-linejoin: round;

  filter:
    drop-shadow(
      0 1px 1px #174760
    );
}

/* =====================================================
   РЫБКИ
===================================================== */

.fish {
  position: absolute;

  left: 0;
  top: 0;

  width: 216px;
  height: 134px;

  padding: 0;

  border: 0;

  background: transparent;

  cursor: pointer;

  z-index: 5;

  will-change: transform;
}

.fish:disabled {
  cursor: default;
}

.fish-shell {
  position: absolute;
  inset: 0;

  transform-origin: center center;

  pointer-events: none;
}

.fish.right .fish-shell {
  transform: scaleX(-1);
}

.fish-body-image {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;
  height: 134px;

  object-fit: contain;

  z-index: 2;

  pointer-events: none;
  user-select: none;

  filter:
    drop-shadow(
      0 7px 5px #064d6b22
    );
}

.fish-tail-image {
  position: absolute;

  object-fit: contain;

  z-index: 1;

  pointer-events: none;
  user-select: none;

  transform-origin: 15% 50%;

  animation:
    tailSwim .58s
    ease-in-out
    infinite
    alternate;
}

.fish.type1 .fish-tail-image {
  width: 75px;
  height: 100px;

  left: 146px;
  top: 18px;
}

.fish.type2 .fish-tail-image {
  width: 75px;
  height: 100px;

  left: 147px;
  top: 17px;
}

.fish.type3 .fish-tail-image {
  width: 75px;
  height: 100px;

  left: 143px;
  top: 17px;
}

@keyframes tailSwim {

  from {
    transform:
      rotate(-11deg);
  }

  to {
    transform:
      rotate(11deg);
  }

}

/* =====================================================
   КАРТИНКА В ОКОШКЕ РЫБКИ
===================================================== */

.picture {
  position: absolute;

  left: 72px;
  top: 41px;

  width: 61px;
  height: 55px;

  display: grid;
  place-items: center;

  z-index: 4;

  font-size: 43px;

  line-height: 1;

  pointer-events: none;
}

.fish.right .picture {
  transform: scaleX(-1);
}

.picture img {
  width: 92%;
  height: 92%;

  object-fit: contain;

  pointer-events: none;
}

/* =====================================================
   НЕПРАВИЛЬНАЯ РЫБКА — РЫВОК
===================================================== */

.fish.wrong-pull .fish-shell {
  animation:
    fishStruggle .18s
    ease-in-out
    infinite
    alternate;
}

@keyframes fishStruggle {

  from {
    transform:
      translateY(-3px)
      rotate(-3deg);
  }

  to {
    transform:
      translateY(4px)
      rotate(4deg);
  }

}

.fish.right.wrong-pull .fish-shell {

  animation-name:
    fishStruggleRight;

}

@keyframes fishStruggleRight {

  from {
    transform:
      scaleX(-1)
      translateY(-3px)
      rotate(-3deg);
  }

  to {
    transform:
      scaleX(-1)
      translateY(4px)
      rotate(4deg);
  }

}

/* =====================================================
   ФИНАЛ
===================================================== */

#finish[hidden] {
  display: none;
}

#finish {
  position: absolute;

  inset: 0;

  z-index: 40;

  display: grid;
  place-items: center;

  background:
    #063a5875;

  backdrop-filter:
    blur(7px);
}

.finish-card {
  width: 588px;

  padding: 46px;

  border:
    6px solid #fff;

  border-radius: 43px;

  background:
    linear-gradient(
      #fffef5,
      #fff2d6
    );

  box-shadow:
    0 30px 96px #052c554a;

  text-align: center;
}

.finish-icon {
  font-size: 90px;
}

.finish-card h2 {
  margin:
    20px 0 14px;

  font-size: 47px;
}

.finish-card p {
  margin: 0;

  font-size: 28px;

  line-height: 1.5;
}

#restart {
  margin-top: 31px;

  padding: 20px 36px;

  border:
    2px solid #ffe7ab;

  border-radius: 23px;

  background:
    linear-gradient(
      #ffdc82,
      #ffc15d
    );

  color: #694619;

  box-shadow:
    0 6px 0 #da9b3e;

  font-size: 28px;

  font-weight: bold;

  cursor: pointer;
}

#restart:active {
  transform:
    translateY(3px);

  box-shadow:
    0 2px 0 #da9b3e;
}

</style>
</head>

<body>

<div id="viewport">

<main id="game">

<img
  id="background"
  src="fon_game.png"
  alt=""
  draggable="false"
>

<div id="wavesBack" class="wave-track">

  <img
    src="wave_back.png"
    alt=""
    draggable="false"
  >

  <img
    src="wave_back.png"
    alt=""
    draggable="false"
  >

</div>

<header>

  <div class="title-card">

    <h1>
      Весёлая рыбалка
    </h1>

    <p class="subtitle">
      Лови картинки со звуком
      <strong>С</strong>
    </p>

  </div>

  <div class="score-card">

    <div class="score-label">
      Наш улов
    </div>

    <div id="score">
      🐟 0 / 6
    </div>

    <div class="progress">
      <div id="progressFill"></div>
    </div>

  </div>

</header>

<div id="boatShadow"></div>

<div id="boat">

  <img
    id="boyBase"
    src="boy_open.png"
    alt="Мальчик в лодке"
    draggable="false"
  >

</div>

<div id="wavesFront" class="wave-track">

  <img
    src="wave_front.png"
    alt=""
    draggable="false"
  >

  <img
    src="wave_front.png"
    alt=""
    draggable="false"
  >

</div>

<svg
  id="tackle"
  viewBox="0 0 1920 1080"
  aria-hidden="true"
>

  <path id="line"></path>
  <path id="rod"></path>
  <path id="rodLight"></path>
  <line id="rodHandle"></line>
  <path id="hook"></path>

</svg>

<div
  id="finish"
  role="dialog"
  aria-modal="true"
  hidden
>

  <div class="finish-card">

    <div class="finish-icon">
      🎣 🐟
    </div>

    <h2>
      Отличный улов!
    </h2>

    <p>
      Все рыбки со звуком С
      <br>
      оказались в лодке!
    </p>

    <button id="restart">
      Рыбачить ещё раз
    </button>

  </div>

</div>

</main>
</div>

<script>

"use strict";

/* =====================================================
   КАРТОЧКИ
===================================================== */

const CARDS = [

  {
    name: "Сок",
    emoji: "🧃",
    correct: true
  },

  {
    name: "Сова",
    emoji: "🦉",
    correct: true
  },

  {
    name: "Сыр",
    emoji: "🧀",
    correct: true
  },

  {
    name: "Сумка",
    emoji: "👜",
    correct: true
  },

  {
    name: "Автобус",
    emoji: "🚌",
    correct: true
  },

  {
    name: "Ананас",
    emoji: "🍍",
    correct: true
  },

  {
    name: "Мяч",
    emoji: "⚽",
    correct: false
  },

  {
    name: "Кот",
    emoji: "🐱",
    correct: false
  },

  {
    name: "Дом",
    emoji: "🏠",
    correct: false
  },

  {
    name: "Жук",
    emoji: "🐞",
    correct: false
  }

];

/* =====================================================
   ТРИ ВИДА РЫБ
===================================================== */

const FISH_TYPES = [

  {
    type: "type1",
    body: "fish/fish1_body.png",
    tail: "fish/fish1_tail.png"
  },

  {
    type: "type2",
    body: "fish/fish2_body.png",
    tail: "fish/fish2_tail.png"
  },

  {
    type: "type3",
    body: "fish/fish3_body.png",
    tail: "fish/fish3_tail.png"
  }

];

/* =====================================================
   РАЗМЕРЫ
===================================================== */

const WIDTH = 1920;
const HEIGHT = 1080;

const FISH_WIDTH = 216;
const FISH_HEIGHT = 134;

const LANES = [
  500,
  690,
  855
];

const BOAT_X = 625;
const BOAT_WIDTH = 670;

const WATER_Y = 390;

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
  document.getElementById("game");

const viewport =
  document.getElementById("viewport");

const boat =
  document.getElementById("boat");

const boyBase =
  document.getElementById("boyBase");

const rod =
  document.getElementById("rod");

const rodLight =
  document.getElementById("rodLight");

const rodHandle =
  document.getElementById("rodHandle");

const line =
  document.getElementById("line");

const hook =
  document.getElementById("hook");

const score =
  document.getElementById("score");

const progressFill =
  document.getElementById("progressFill");

const finish =
  document.getElementById("finish");

const restart =
  document.getElementById("restart");

const total =
  CARDS.filter(
    card => card.correct
  ).length;

/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let fishes = [];
let queue = [];

let caught = 0;

let action = null;

let previousTime = null;

let clock = 0;

let boatHeight = 450;

let spawnNumber = 0;

/* =====================================================
   МАСШТАБ
===================================================== */

function resizeGame() {

  const scale =
    Math.min(

      document.documentElement.clientWidth /
      WIDTH,

      document.documentElement.clientHeight /
      HEIGHT

    );

  viewport.style.width =
    `${WIDTH * scale}px`;

  viewport.style.height =
    `${HEIGHT * scale}px`;

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   РАЗМЕР ЛОДКИ
===================================================== */

function measureBoat() {

  if (!boyBase.naturalWidth) {
    return;
  }

  boatHeight =

    BOAT_WIDTH *

    boyBase.naturalHeight /

    boyBase.naturalWidth;

  boat.style.height =
    `${boatHeight}px`;

}

boyBase.addEventListener(
  "load",
  measureBoat
);

if (boyBase.complete) {
  measureBoat();
}

/* =====================================================
   ВСПОМОГАТЕЛЬНЫЕ
===================================================== */

function shuffle(items) {

  const result =
    [...items];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

function mix(a, b, t) {

  return (
    a +
    (b - a) * t
  );

}

function smooth(t) {

  return (
    t * t *
    (3 - 2 * t)
  );

}

function updateScore() {

  score.textContent =
    `🐟 ${caught} / ${total}`;

  progressFill.style.width =

    `${
      total
        ? caught / total * 100
        : 0
    }%`;

}

/* =====================================================
   ЛОДКА
===================================================== */

function getBoatPose() {

  const bob =
    Math.sin(
      clock * 1.5
    ) * 3;

  const top =

    WATER_Y -

    boatHeight * .72 +

    bob;

  boat.style.top =
    `${top}px`;

  boat.style.transform =

    `rotate(${
      Math.sin(
        clock * 1.25
      ) * .5
    }deg)`;

  return {

    hand: {

      x:
        BOAT_X +
        BOAT_WIDTH * .595,

      y:
        top +
        boatHeight * .465

    },

    tip: {

      x:
        BOAT_X +
        BOAT_WIDTH * .595 +
        300,

      y:
        top +
        boatHeight * .465 -
        145

    },

    /*
      ТОЧКА ВНУТРИ ЛОДКИ.

      Именно сюда теперь прилетает
      правильная рыбка.
    */

    landing: {

      x:
        BOAT_X +
        BOAT_WIDTH * .61,

      y:
        top +
        boatHeight * .68

    }

  };

}

/* =====================================================
   УДОЧКА
===================================================== */

function drawRod(
  pose,
  bend = 0
) {

  const {
    hand,
    tip
  } = pose;

  const path = `

    M ${hand.x - 8}
      ${hand.y + 12}

    Q ${hand.x + 125}
      ${hand.y - 185 + bend * .35}

      ${tip.x}
      ${tip.y + bend}

  `;

  rod.setAttribute(
    "d",
    path
  );

  rodLight.setAttribute(
    "d",
    path
  );

  rodHandle.setAttribute(
    "x1",
    hand.x - 12
  );

  rodHandle.setAttribute(
    "y1",
    hand.y + 18
  );

  rodHandle.setAttribute(
    "x2",
    hand.x + 8
  );

  rodHandle.setAttribute(
    "y2",
    hand.y - 11
  );

  return {

    x:
      tip.x,

    y:
      tip.y + bend

  };

}

function drawLine(
  tip,
  end,
  showHook = true
) {

  const curve =

    Math.min(

      50,

      Math.abs(
        end.y -
        tip.y
      ) * .08

    );

  line.setAttribute(

    "d",

    `

    M ${tip.x}
      ${tip.y}

    Q ${tip.x + curve}
      ${(tip.y + end.y) / 2}

      ${end.x}
      ${end.y}

    `

  );

  hook.style.display =

    showHook
      ? ""
      : "none";

  hook.setAttribute(

    "d",

    `

    M ${end.x}
      ${end.y - 24}

    L ${end.x}
      ${end.y - 8}

    Q ${end.x}
      ${end.y + 1}

      ${end.x - 8}
      ${end.y}

    Q ${end.x - 18}
      ${end.y - 1}

      ${end.x - 16}
      ${end.y - 12}

    L ${end.x - 11}
      ${end.y - 7}

    `

  );

}

/* =====================================================
   СОЗДАНИЕ РЫБ
===================================================== */

function spawnFish(
  lane,
  initial = false
) {

  if (!queue.length) {
    return;
  }

  const card =
    queue.shift();

  const direction =

    spawnNumber++ % 2 === 0
      ? 1
      : -1;

  /*
    Тип рыбки выбирается случайно.
    Поэтому на экране могут повторяться
    одни и те же три вида рыб.
  */

  const fishType =

    FISH_TYPES[
      Math.floor(
        Math.random() *
        FISH_TYPES.length
      )
    ];

  const element =
    document.createElement(
      "button"
    );

  element.type =
    "button";

  element.className =

    `fish ${fishType.type}` +

    (
      direction === 1
        ? " right"
        : ""
    );

  element.setAttribute(
    "aria-label",
    card.name
  );

  element.innerHTML = `

    <span class="fish-shell">

      <img
        class="fish-tail-image"
        src="${fishType.tail}"
        alt=""
        draggable="false"
      >

      <img
        class="fish-body-image"
        src="${fishType.body}"
        alt=""
        draggable="false"
      >

      <span
        class="picture"
        aria-hidden="true"
      >
        ${card.emoji}
      </span>

    </span>

  `;

  const initialPositions = [
    240,
    1230,
    700
  ];

  const fish = {

    card,

    element,

    lane,

    direction,

    x:
      initial
        ? initialPositions[lane]
        : direction === 1
          ? -FISH_WIDTH - 30
          : WIDTH + 30,

    y:
      LANES[lane],

    speed:
      78 +
      Math.random() * 24,

    phase:
      Math.random() *
      Math.PI * 2,

    removed:
      false

  };

  element.disabled =
    Boolean(action) ||
    !finish.hidden;

  element.addEventListener(

    "click",

    () =>
      selectFish(fish)

  );

  game.appendChild(
    element
  );

  fishes.push(
    fish
  );

  renderFish(
    fish
  );

}

/* =====================================================
   РЕНДЕР РЫБ
===================================================== */

function renderFish(
  fish,
  scale = 1,
  rotation = 0
) {

  fish.element.style.transform = `

    translate(
      ${fish.x}px,
      ${fish.y}px
    )

    rotate(
      ${rotation}deg
    )

    scale(
      ${scale}
    )

  `;

}

function setFishEnabled(
  enabled
) {

  for (
    const fish
    of fishes
  ) {

    fish.element.disabled =
      !enabled;

  }

}

/* =====================================================
   НАЖАТИЕ НА РЫБУ
===================================================== */

function selectFish(
  fish
) {

  if (
    action ||
    fish.removed ||
    !finish.hidden
  ) {
    return;
  }

  setFishEnabled(
    false
  );

  fish.element.style.zIndex =
    "10";

  /*
    НЕПРАВИЛЬНАЯ РЫБКА.

    Крючок идёт к ней,
    она тянет удочку вниз,
    затем срывается.
  */

  if (
    !fish.card.correct
  ) {

    action = {

      type:
        "wrong",

      fish,

      stage:
        "hook",

      elapsed:
        0,

      startX:
        fish.x,

      startY:
        fish.y

    };

    return;

  }

  /*
    ПРАВИЛЬНАЯ РЫБКА.
  */

  action = {

    type:
      "correct",

    fish,

    stage:
      "lower",

    elapsed:
      0,

    startX:
      fish.x,

    startY:
      fish.y

  };

}

/* =====================================================
   ПРАВИЛЬНАЯ РЫБКА
===================================================== */

function animateCorrectCatch(
  dt,
  pose
) {

  const current =
    action;

  const fish =
    current.fish;

  current.elapsed +=
    dt;

  /* -------------------------
     КРЮЧОК К РЫБКЕ
  ------------------------- */

  if (
    current.stage ===
    "lower"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / .72,
          1
        )

      );

    const tip =
      drawRod(
        pose,
        t * 12
      );

    drawLine(

      tip,

      {

        x:
          mix(

            tip.x + 6,

            fish.x +
            FISH_WIDTH / 2,

            t

          ),

        y:
          mix(

            tip.y + 58,

            fish.y + 22,

            t

          )

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "lift";

      current.elapsed =
        0;

    }

    return;

  }

  /* -------------------------
     ПОДНИМАЕМ РЫБКУ
  ------------------------- */

  if (
    current.stage ===
    "lift"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / 1.45,
          1
        )

      );

    fish.x =

      mix(

        current.startX,

        pose.landing.x -
        FISH_WIDTH / 2,

        t

      );

    fish.y =

      mix(

        current.startY,

        pose.landing.y -
        FISH_HEIGHT * .58,

        t

      );

    const scale =
      1 -
      t * .23;

    renderFish(
      fish,
      scale,
      Math.sin(
        t * Math.PI
      ) * 5
    );

    const tip =

      drawRod(

        pose,

        12 +
        Math.sin(
          t * Math.PI
        ) * 13

      );

    drawLine(

      tip,

      {

        x:
          fish.x +
          FISH_WIDTH / 2,

        y:
          fish.y + 22

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "intoBoat";

      current.elapsed =
        0;

      current.boatX =
        fish.x;

      current.boatY =
        fish.y;

      /*
        Теперь рыбка оказывается
        визуально за передним бортом лодки.
      */

      fish.element.style.zIndex =
        "6";

    }

    return;

  }

  /* -------------------------
     РЫБКА ПАДАЕТ ВНУТРЬ ЛОДКИ
  ------------------------- */

  const t =

    smooth(

      Math.min(
        current.elapsed / .48,
        1
      )

    );

  fish.x =

    mix(

      current.boatX,

      pose.landing.x -
      FISH_WIDTH / 2,

      t

    );

  /*
    ВАЖНО:
    рыбка больше не падает вниз
    за лодку.

    Она опускается совсем немного
    ВНУТРЬ лодки.
  */

  fish.y =

    mix(

      current.boatY,

      pose.landing.y -
      FISH_HEIGHT * .20,

      t

    );

  const scale =
    mix(
      .77,
      .35,
      t
    );

  renderFish(

    fish,

    scale,

    t * 7

  );

  /*
    Исчезновение начинается уже
    внутри лодки.
  */

  fish.element.style.opacity =

    String(
      1 -
      Math.pow(
        t,
        2.2
      )
    );

  const tip =
    drawRod(

      pose,

      (1 - t) * 12

    );

  drawLine(

    tip,

    {

      x:
        tip.x + 6,

      y:
        tip.y + 58

    }

  );

  if (
    t >= 1
  ) {

    finishCatch(
      fish
    );

  }

}

/* =====================================================
   НЕПРАВИЛЬНАЯ РЫБКА
===================================================== */

function animateWrongCatch(
  dt,
  pose
) {

  const current =
    action;

  const fish =
    current.fish;

  current.elapsed +=
    dt;

  /* -------------------------
     КРЮЧОК ИДЁТ К РЫБКЕ
  ------------------------- */

  if (
    current.stage ===
    "hook"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / .58,
          1
        )

      );

    const tip =
      drawRod(
        pose,
        t * 9
      );

    drawLine(

      tip,

      {

        x:
          mix(

            tip.x + 6,

            fish.x +
            FISH_WIDTH / 2,

            t

          ),

        y:
          mix(

            tip.y + 58,

            fish.y + 25,

            t

          )

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "pull";

      current.elapsed =
        0;

      current.pullStartY =
        fish.y;

      fish.element.classList.add(
        "wrong-pull"
      );

    }

    return;

  }

  /* -------------------------
     РЫБКА ТЯНЕТ УДОЧКУ ВНИЗ
  ------------------------- */

  if (
    current.stage ===
    "pull"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / .82,
          1
        )

      );

    /*
      Рыбка резко уходит вниз.
    */

    fish.y =

      current.pullStartY +

      t * 105 +

      Math.sin(
        current.elapsed * 23
      ) * 7;

    /*
      И немного тянет в сторону,
      в которую плыла.
    */

    fish.x +=

      fish.direction *
      dt *
      24;

    renderFish(
      fish
    );

    /*
      Удочка сильно сгибается.
    */

    const bend =

      18 +
      t * 115 +
      Math.sin(
        current.elapsed * 18
      ) * 6;

    const tip =
      drawRod(
        pose,
        bend
      );

    drawLine(

      tip,

      {

        x:
          fish.x +
          FISH_WIDTH / 2,

        y:
          fish.y + 25

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "snap";

      current.elapsed =
        0;

      current.snapX =
        fish.x;

      current.snapY =
        fish.y;

      fish.element.classList.remove(
        "wrong-pull"
      );

    }

    return;

  }

  /* -------------------------
     РЫБКА СРЫВАЕТСЯ
  ------------------------- */

  if (
    current.stage ===
    "snap"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / .42,
          1
        )

      );

    /*
      После срыва рыбка резко
      уходит от крючка.
    */

    fish.x =

      current.snapX +

      fish.direction *
      t *
      85;

    fish.y =

      current.snapY +

      t * 20;

    renderFish(

      fish,

      1,

      fish.direction *
      -t * 5

    );

    /*
      Крючок отскакивает вверх.
    */

    const bend =
      mix(
        130,
        28,
        t
      );

    const tip =
      drawRod(
        pose,
        bend
      );

    const looseEnd = {

      x:
        mix(

          current.snapX +
          FISH_WIDTH / 2,

          tip.x + 12,

          t

        ),

      y:
        mix(

          current.snapY + 25,

          tip.y + 100,

          t

        )

    };

    drawLine(
      tip,
      looseEnd
    );

    if (
      t >= 1
    ) {

      current.stage =
        "return";

      current.elapsed =
        0;

    }

    return;

  }

  /* -------------------------
     УДОЧКА ВОЗВРАЩАЕТСЯ ПУСТОЙ
  ------------------------- */

  const t =

    smooth(

      Math.min(
        current.elapsed / .62,
        1
      )

    );

  /*
    Рыбка снова начинает
    нормальное движение.
  */

  fish.x +=

    fish.direction *
    fish.speed *
    dt;

  fish.y +=

    Math.sin(
      current.elapsed * 7
    ) * .5;

  renderFish(
    fish
  );

  const bend =
    mix(
      28,
      0,
      t
    );

  const tip =
    drawRod(
      pose,
      bend
    );

  drawLine(

    tip,

    {

      x:
        tip.x +
        6 +
        Math.sin(
          clock * 1.8
        ) * 4,

      y:
        tip.y +
        58

    }

  );

  if (
    t >= 1
  ) {

    fish.element.style.zIndex =
      "5";

    action =
      null;

    setFishEnabled(
      true
    );

  }

}

/* =====================================================
   РЫБКА ПОЙМАНА
===================================================== */

function finishCatch(
  fish
) {

  fish.removed =
    true;

  fish.element.remove();

  fishes =

    fishes.filter(

      item =>
        item !== fish

    );

  caught++;

  updateScore();

  action =
    null;

  if (
    caught === total
  ) {

    setFishEnabled(
      false
    );

    finish.hidden =
      false;

    restart.focus();

    return;

  }

  spawnFish(
    fish.lane
  );

  setFishEnabled(
    true
  );

}

/* =====================================================
   ДВИЖЕНИЕ РЫБ
===================================================== */

function moveFishes(
  dt
) {

  for (
    const fish
    of [...fishes]
  ) {

    if (
      action &&
      action.fish === fish
    ) {
      continue;
    }

    fish.x +=

      fish.direction *

      fish.speed *

      dt;

    fish.y =

      LANES[fish.lane] +

      Math.sin(

        clock * 1.7 +

        fish.phase

      ) * 11;

    renderFish(
      fish
    );

    const outside =

      fish.direction === 1

        ? fish.x >
          WIDTH + 35

        : fish.x <
          -FISH_WIDTH - 35;

    if (
      outside
    ) {

      fish.removed =
        true;

      fish.element.remove();

      fishes =

        fishes.filter(

          item =>
            item !== fish

        );

      queue.push(
        fish.card
      );

      spawnFish(
        fish.lane
      );

    }

  }

}

/* =====================================================
   ГЛАВНЫЙ ЦИКЛ
===================================================== */

function frame(
  timestamp
) {

  const dt =

    previousTime === null

      ? 0

      : Math.min(

          (
            timestamp -
            previousTime
          ) / 1000,

          .05

        );

  previousTime =
    timestamp;

  if (
    finish.hidden &&
    !document.hidden
  ) {

    clock +=
      dt;

    const pose =
      getBoatPose();

    moveFishes(
      dt
    );

    if (
      action
    ) {

      if (
        action.type ===
        "correct"
      ) {

        animateCorrectCatch(
          dt,
          pose
        );

      } else {

        animateWrongCatch(
          dt,
          pose
        );

      }

    } else {

      const tip =
        drawRod(
          pose
        );

      drawLine(

        tip,

        {

          x:
            tip.x +
            6 +
            Math.sin(
              clock * 1.8
            ) * 4,

          y:
            tip.y +
            58

        }

      );

    }

  }

  requestAnimationFrame(
    frame
  );

}

document.addEventListener(

  "visibilitychange",

  () => {

    previousTime =
      null;

  }

);

/* =====================================================
   НОВАЯ ИГРА
===================================================== */

function resetGame() {

  for (
    const fish
    of fishes
  ) {

    fish.element.remove();

  }

  fishes =
    [];

  queue =
    shuffle(
      CARDS
    );

  caught =
    0;

  action =
    null;

  clock =
    0;

  previousTime =
    null;

  spawnNumber =
    0;

  finish.hidden =
    true;

  updateScore();

  for (
    let lane = 0;
    lane < LANES.length;
    lane++
  ) {

    spawnFish(
      lane,
      true
    );

  }

  const pose =
    getBoatPose();

  const tip =
    drawRod(
      pose
    );

  drawLine(

    tip,

    {

      x:
        tip.x + 6,

      y:
        tip.y + 58

    }

  );

}

restart.addEventListener(

  "click",

  () => {

    resetGame();

  }

);

resetGame();

requestAnimationFrame(
  frame
);

</script>
