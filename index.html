<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Весёлая рыбалка</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #164766;
  background: #83dbef;
}

button {
  font: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#game {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 560px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(#92dfff, #e4f8ff 40%);
}

.sun {
  position: absolute;
  top: 100px;
  right: 9%;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: #ffe797;
  box-shadow: 0 0 0 15px #ffe79733;
}

.cloud {
  position: absolute;
  width: 130px;
  height: 35px;
  border-radius: 60px;
  background: #ffffffb8;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: inherit;
}

.cloud::before {
  width: 60px;
  height: 60px;
  left: 20px;
  bottom: 0;
}

.cloud::after {
  width: 45px;
  height: 45px;
  right: 17px;
  bottom: 0;
}

.cloud.one { top: 140px; left: 8%; }
.cloud.two { top: 205px; right: 24%; transform: scale(.7); }

header {
  position: absolute;
  top: 18px;
  left: 16px;
  right: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title,
#score {
  padding: 12px 20px;
  border: 2px solid #ffffffb5;
  border-radius: 24px;
  background: #ffffffdf;
  box-shadow: 0 5px 20px #23677b12;
}

h1 {
  margin: 0 0 4px;
  font-size: clamp(22px, 3vw, 34px);
}

.subtitle {
  margin: 0;
  font-size: clamp(13px, 1.7vw, 18px);
}

#score {
  white-space: nowrap;
  font-size: 20px;
  font-weight: bold;
}

#sea {
  position: absolute;
  inset: 39% 0 0;
  background: linear-gradient(
    #39c7dc 0%,
    #1caaca 30%,
    #138ab8 68%,
    #126f9c 100%
  );
  border-top: 5px solid #a4f2ef;
}

#sea::before {
  content: "";
  position: absolute;
  inset: 10px 0 0;
  background: repeating-linear-gradient(
    115deg,
    transparent 0 110px,
    #ffffff09 110px 170px,
    transparent 170px 260px
  );
  pointer-events: none;
}

.ripple {
  position: absolute;
  top: 41%;
  width: 80px;
  height: 7px;
  border-radius: 50%;
  background: #d2ffff70;
}

.ripple.a { left: 7%; }
.ripple.b { right: 10%; width: 120px; top: 43%; }
.ripple.c { left: 27%; width: 55px; top: 45%; }

#boat {
  position: absolute;
  width: clamp(245px, 34vw, 390px);
  height: auto;
  left: 50%;
  top: 39%;
  transform: translate(-50%, -84%);
  z-index: 4;
  overflow: visible;
}

/* Леска располагается поверх моря и рыб. */
#fishingLayer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 6;
}

#line {
  fill: none;
  stroke: #f4ffff;
  stroke-width: 2;
  stroke-linecap: round;
}

#hook {
  fill: none;
  stroke: #3e5262;
  stroke-width: 3;
  stroke-linecap: round;
}

.fish {
  position: absolute;
  left: 0;
  top: 0;
  width: clamp(112px, 14vw, 170px);
  height: clamp(76px, 9vw, 106px);
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  z-index: 3;
  will-change: transform;
}

.fish:focus-visible {
  outline: 3px dashed white;
  outline-offset: 5px;
  border-radius: 45%;
}

.fish-body {
  position: absolute;
  inset: 8% 16% 8% 4%;
  border-radius: 49% 53% 48% 50%;
  background: var(--color);
  box-shadow:
    inset 0 -9px 0 #0000000d,
    inset 0 6px 0 #ffffff25;
}

.fish-tail {
  position: absolute;
  right: 0;
  top: 20%;
  width: 30%;
  height: 60%;
  background: var(--color);
  clip-path: polygon(0 50%, 100% 0, 85% 50%, 100% 100%);
}

.fish-fin {
  position: absolute;
  left: 34%;
  top: 0;
  width: 31%;
  height: 28%;
  background: var(--color);
  clip-path: polygon(0 100%, 55% 0, 100% 100%);
}

.fish-eye {
  position: absolute;
  left: 12%;
  top: 29%;
  width: 13px;
  height: 16px;
  border-radius: 50%;
  background: white;
}

.fish-eye::after {
  content: "";
  position: absolute;
  left: 3px;
  top: 5px;
  width: 6px;
  height: 7px;
  background: #173e55;
  border-radius: 50%;
}

.fish-picture {
  position: absolute;
  left: 32%;
  top: 22%;
  width: 43%;
  height: 57%;
  display: grid;
  place-items: center;
  background: #fff9e9;
  border-radius: 17px;
  font-size: clamp(28px, 4vw, 44px);
}

.fish-picture img {
  display: block;
  width: 88%;
  height: 88%;
  object-fit: contain;
}

/* Разворачиваем рыбу, но сохраняем положение картинки. */
.fish.right .fish-shape {
  transform: scaleX(-1);
}

.fish-shape {
  position: absolute;
  inset: 0;
}

.fish.right .fish-picture {
  left: 25%;
}

.fish.wrong .fish-picture {
  animation: wiggle .35s ease;
}

@keyframes wiggle {
  25% { transform: rotate(-12deg); }
  75% { transform: rotate(12deg); }
}

#sand {
  position: absolute;
  bottom: -24px;
  left: -5%;
  width: 110%;
  height: 65px;
  border-radius: 50% 50% 0 0;
  background: #e9cf98;
  z-index: 2;
}

.plant {
  position: absolute;
  bottom: 28px;
  width: 12px;
  height: 85px;
  border-radius: 100% 0 0 0;
  border-left: 9px solid #55bd9c;
  transform: rotate(12deg);
  transform-origin: bottom;
}

.plant::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 8px;
  height: 60px;
  width: 18px;
  border-right: 8px solid #77d0a7;
  border-radius: 0 100% 0 0;
}

#message {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;
  width: max-content;
  max-width: 92%;
  padding: 10px 18px;
  border-radius: 22px;
  background: #ffffffed;
  text-align: center;
  font-size: clamp(14px, 2vw, 19px);
  pointer-events: none;
}

#finish {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  background: #123e6670;
  backdrop-filter: blur(6px);
}

#finish[hidden] {
  display: none;
}

.finish-card {
  width: min(420px, 90%);
  padding: 32px;
  text-align: center;
  background: #fffbee;
  border: 5px solid white;
  border-radius: 32px;
  box-shadow: 0 20px 60px #12334a40;
}

.finish-card h2 {
  font-size: 30px;
  margin: 12px 0;
}

.finish-card p {
  font-size: 19px;
  line-height: 1.5;
}

#restart {
  margin-top: 10px;
  padding: 15px 24px;
  border: 0;
  border-radius: 18px;
  background: #ffcc69;
  color: #654718;
  font-weight: bold;
  cursor: pointer;
}

@media (max-width: 600px) {
  header { top: 10px; left: 10px; right: 10px; gap: 7px; }
  .title { padding: 10px 12px; }
  #score { padding: 12px 10px; font-size: 16px; }
  .subtitle { max-width: 215px; }
  .sun { right: 8%; top: 155px; width: 50px; height: 50px; }
}
</style>
</head>

<body>
<main id="game">
  <div class="sun"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <header>
    <div class="title">
      <h1>Весёлая рыбалка</h1>
      <p class="subtitle">Лови рыбок с картинками на звук С</p>
    </div>
    <div id="score" aria-live="polite">🐟 0 / 6</div>
  </header>

  <div id="sea"></div>
  <div class="ripple a"></div>
  <div class="ripple b"></div>
  <div class="ripple c"></div>

  <!-- ЛОДКА, РЫБАК И УДОЧКА -->
  <svg id="boat" viewBox="0 0 400 250" aria-hidden="true">
    <!-- Удочка -->
    <path d="M211 115 Q273 17 351 45"
          fill="none" stroke="#735135"
          stroke-width="6" stroke-linecap="round"/>

    <!-- Кончик удочки: используется для положения лески -->
    <circle id="rodTip" cx="351" cy="45" r="3" fill="#735135"/>

    <!-- Ноги -->
    <path d="M169 161 L196 169 L209 197 M188 155 L220 167 L229 193"
          fill="none" stroke="#365c88"
          stroke-width="17" stroke-linecap="round"/>

    <!-- Тело -->
    <path d="M146 112 Q165 99 184 115 L193 159 L144 159 Z"
          fill="#f28a63"/>

    <!-- Рука -->
    <path d="M177 124 L197 140 L217 113"
          fill="none" stroke="#ffd4a6"
          stroke-width="13" stroke-linecap="round"/>

    <!-- Голова -->
    <circle cx="166" cy="83" r="25" fill="#ffd4a6"/>
    <circle cx="188" cy="88" r="6" fill="#ffd4a6"/>
    <circle cx="175" cy="80" r="2.7" fill="#24455a"/>
    <path d="M173 96 Q180 100 185 94"
          fill="none" stroke="#b7704d"
          stroke-width="2.5" stroke-linecap="round"/>

    <!-- Шляпа -->
    <path d="M139 68 L146 42 Q164 34 183 43 L190 68"
          fill="#edc16d"/>
    <path d="M133 69 Q168 60 199 70"
          fill="none" stroke="#d6a04c"
          stroke-width="11" stroke-linecap="round"/>
    <path d="M145 56 L186 56" stroke="#ae7e43" stroke-width="7"/>

    <!-- Сиденье -->
    <path d="M118 172 L231 172" stroke="#815035" stroke-width="10"/>

    <!-- Внутренняя часть лодки -->
    <ellipse cx="181" cy="185" rx="145" ry="20" fill="#8b5337"/>

    <!-- Точка, в которую попадает пойманная рыба -->
    <circle id="boatTarget" cx="254" cy="185" r="2" fill="#8b5337"/>

    <!-- Корпус -->
    <path d="M30 184 Q177 214 335 180 L303 222
             Q182 252 66 223 Z"
          fill="#d88b48" stroke="#995b33" stroke-width="4"/>
    <path d="M57 202 Q181 230 315 199"
          fill="none" stroke="#f7ba70" stroke-width="5"/>
    <path d="M87 216 L102 235 M150 225 L154 244 M220 223 L216 242"
          stroke="#b5703c" stroke-width="3"/>
  </svg>

  <svg id="fishingLayer" aria-hidden="true">
    <path id="line"/>
    <path id="hook"/>
  </svg>

  <div id="sand">
    <div class="plant" style="left: 8%"></div>
    <div class="plant" style="left: 15%; height: 60px"></div>
    <div class="plant" style="left: 84%; height: 100px"></div>
    <div class="plant" style="left: 91%; height: 70px"></div>
  </div>

  <div id="message" role="status">Нажми на рыбку с подходящей картинкой</div>

  <div id="finish" hidden>
    <div class="finish-card">
      <div style="font-size: 64px">🎣 🐟</div>
      <h2>Отличный улов!</h2>
      <p>Все рыбки со звуком С<br>оказались в лодке!</p>
      <button id="restart">Рыбачить ещё раз</button>
    </div>
  </div>
</main>

<script>
/* =====================================================
   КАРТИНКИ НА РЫБКАХ

   name — название картинки.
   emoji — временная картинка.
   image — путь к твоей картинке.
   correct: true — эту рыбу нужно поймать.
   correct: false — эту рыбу ловить не нужно.

   Пример замены:
   { name: "Сок", emoji: "🧃", image: "sok.png", correct: true }

   Картинка sok.png должна лежать рядом с HTML-файлом.
   Можно указать папку: "images/sok.png".
===================================================== */

const CARDS = [
  { name: "Сок",     emoji: "🧃", image: "", correct: true },
  { name: "Сова",    emoji: "🦉", image: "", correct: true },
  { name: "Сыр",     emoji: "🧀", image: "", correct: true },
  { name: "Сумка",   emoji: "👜", image: "", correct: true },
  { name: "Автобус", emoji: "🚌", image: "", correct: true },
  { name: "Ананас",  emoji: "🍍", image: "", correct: true },

  { name: "Мяч",     emoji: "⚽", image: "", correct: false },
  { name: "Кот",     emoji: "🐱", image: "", correct: false },
  { name: "Дом",     emoji: "🏠", image: "", correct: false },
  { name: "Жук",     emoji: "🐞", image: "", correct: false }
];

const COLORS = [
  "#ffc46c", "#ff9290", "#c4a1ef",
  "#80d7bd", "#ffaf78", "#f4a6cd"
];

const game = document.getElementById("game");
const boat = document.getElementById("boat");
const rodTip = document.getElementById("rodTip");
const boatTarget = document.getElementById("boatTarget");
const line = document.getElementById("line");
const hook = document.getElementById("hook");
const score = document.getElementById("score");
const message = document.getElementById("message");
const finish = document.getElementById("finish");

let fishes = [];
let queue = [];
let caught = 0;
let action = null;
let previousTime = null;
let messageUntil = 0;

const total = CARDS.filter(card => card.correct).length;

/* Одновременно на экране три рыбки — по одной на глубину. */
const LANES = 3;

function shuffle(items) {
  const result = [...items];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function svgPoint(element) {
  const point = boat.createSVGPoint();
  point.x = element.cx.baseVal.value;
  point.y = element.cy.baseVal.value;

  const screenPoint = point.matrixTransform(element.getScreenCTM());
  const rect = game.getBoundingClientRect();

  return {
    x: screenPoint.x - rect.left,
    y: screenPoint.y - rect.top
  };
}

function laneY(lane, height) {
  const top = game.clientHeight * .47;
  const bottom = game.clientHeight - 95 - height;
  return top + (bottom - top) * lane / (LANES - 1);
}

function showMessage(text, duration = 2300) {
  message.textContent = text;
  messageUntil = performance.now() + duration;
}

function updateScore() {
  score.textContent = `🐟 ${caught} / ${total}`;
}

function spawnFish(lane, initial = false) {
  if (!queue.length) return;

  const card = queue.shift();
  const element = document.createElement("button");

  /* Направления чередуются при каждом появлении в очереди. */
  const direction = Math.random() > .5 ? 1 : -1;

  element.className = "fish" + (direction === 1 ? " right" : "");
  element.setAttribute("aria-label", card.name);
  element.style.setProperty(
    "--color",
    COLORS[Math.floor(Math.random() * COLORS.length)]
  );

  element.innerHTML = `
    <span class="fish-shape">
      <span class="fish-tail"></span>
      <span class="fish-fin"></span>
      <span class="fish-body"></span>
      <span class="fish-eye"></span>
    </span>
    <span class="fish-picture"></span>
  `;

  const picture = element.querySelector(".fish-picture");
  picture.textContent = card.emoji;

  if (card.image) {
    const img = new Image();
    img.alt = card.name;
    img.onload = () => picture.replaceChildren(img);
    img.src = card.image;
  }

  game.appendChild(element);

  const width = element.offsetWidth;
  const height = element.offsetHeight;

  const fish = {
    card,
    element,
    lane,
    direction,
    width,
    height,
    x: initial
      ? (game.clientWidth - width) * (.15 + lane * .3)
      : direction === 1 ? -width - 15 : game.clientWidth + 15,
    y: laneY(lane, height),
    speed: 23 + Math.random() * 13,
    phase: Math.random() * Math.PI * 2,
    removed: false,
    feedbackUntil: 0
  };

  fishes.push(fish);
  element.addEventListener("click", () => selectFish(fish));
  renderFish(fish);
}

function renderFish(fish, scale = 1, rotation = 0) {
  fish.element.style.transform =
    `translate(${fish.x}px, ${fish.y}px) rotate(${rotation}deg) scale(${scale})`;
}

function selectFish(fish) {
  if (action || fish.removed || !finish.hidden) return;

  if (!fish.card.correct) {
    fish.element.classList.remove("wrong");
    void fish.element.offsetWidth;
    fish.element.classList.add("wrong");
    fish.feedbackUntil = performance.now() + 450;
    showMessage("В этом слове нет звука С. Попробуй другую рыбку!");
    return;
  }

  action = {
    fish,
    stage: "lower",
    elapsed: 0,
    startX: fish.x,
    startY: fish.y
  };

  fish.element.style.zIndex = "7";
  fishes.forEach(item => item.element.disabled = true);
  showMessage("Есть клёв! Поднимаем рыбку…", 10000);
}

function drawLine(start, end, visibleHook = true) {
  const bend = Math.min(28, Math.abs(end.y - start.y) * .09);

  line.setAttribute(
    "d",
    `M ${start.x} ${start.y}
     Q ${start.x + bend} ${(start.y + end.y) / 2}
       ${end.x} ${end.y}`
  );

  hook.style.display = visibleHook ? "" : "none";
  hook.setAttribute(
    "d",
    `M ${end.x} ${end.y - 5}
     v 10
     q 0 9 -7 9
     q -7 0 -7 -7
     l 3 3`
  );
}

function mix(a, b, t) {
  return a + (b - a) * t;
}

function smooth(t) {
  return t * t * (3 - 2 * t);
}

function animateCatch(dt) {
  const current = action;
  const fish = current.fish;
  const tip = svgPoint(rodTip);
  const target = svgPoint(boatTarget);

  current.elapsed += dt;

  if (current.stage === "lower") {
    const t = smooth(Math.min(current.elapsed / .7, 1));

    drawLine(tip, {
      x: mix(tip.x, fish.x + fish.width / 2, t),
      y: mix(tip.y + 30, fish.y + 8, t)
    });

    if (t === 1) {
      current.stage = "lift";
      current.elapsed = 0;
    }

    return;
  }

  if (current.stage === "lift") {
    const t = smooth(Math.min(current.elapsed / 1.45, 1));

    fish.x = mix(current.startX, target.x - fish.width / 2, t);
    fish.y = mix(current.startY, target.y - 95, t);

    renderFish(fish, 1 - .22 * t, Math.sin(t * Math.PI * 4) * 8);
    drawLine(tip, {
      x: fish.x + fish.width / 2,
      y: fish.y + 8
    });

    if (t === 1) {
      current.stage = "drop";
      current.elapsed = 0;
      current.dropX = fish.x;
      current.dropY = fish.y;

      /* Теперь рыбка ныряет за передний борт лодки. */
      fish.element.style.zIndex = "3";
    }

    return;
  }

  const t = Math.min(current.elapsed / .55, 1);

  fish.x = mix(current.dropX, target.x - fish.width / 2, t);
  fish.y = mix(current.dropY, target.y - fish.height / 2 + 15, t * t);
  fish.element.style.opacity = String(1 - t);

  renderFish(fish, .78 - .5 * t, 12 * t);
  drawLine(tip, { x: tip.x, y: tip.y + 30 });

  if (t === 1) {
    fish.removed = true;
    fish.element.remove();
    fishes = fishes.filter(item => item !== fish);
    caught++;
    updateScore();
    action = null;

    fishes.forEach(item => item.element.disabled = false);

    if (caught === total) {
      finish.hidden = false;
      document.getElementById("restart").focus();
    } else {
      showMessage("Рыбка в лодке! Ищем следующую.");
      spawnFish(fish.lane);
    }
  }
}

function frame(now) {
  const dt = previousTime === null
    ? 0
    : Math.min((now - previousTime) / 1000, .05);

  previousTime = now;

  if (finish.hidden) {
    for (const fish of [...fishes]) {
      if (action && action.fish === fish) continue;

      const boost = now < fish.feedbackUntil ? 2 : 1;
      fish.x += fish.direction * fish.speed * dt * boost;
      fish.y = laneY(fish.lane, fish.height)
        + Math.sin(now / 950 + fish.phase) * 7;

      renderFish(fish);

      const outside = fish.direction === 1
        ? fish.x > game.clientWidth + 20
        : fish.x < -fish.width - 20;

      if (outside) {
        fish.removed = true;
        fish.element.remove();
        fishes = fishes.filter(item => item !== fish);

        /* Пропущенная рыбка позже приплывёт снова. */
        queue.push(fish.card);
        spawnFish(fish.lane);

        if (action) {
          fishes.forEach(item => item.element.disabled = true);
        }
      }
    }

    if (action) {
      animateCatch(dt);
    } else {
      const tip = svgPoint(rodTip);
      drawLine(tip, { x: tip.x, y: tip.y + 30 });
    }

    if (now > messageUntil && !action) {
      message.textContent = "Нажми на рыбку с подходящей картинкой";
    }
  }

  requestAnimationFrame(frame);
}

function resetGame() {
  fishes.forEach(fish => fish.element.remove());
  fishes = [];
  queue = shuffle(CARDS);
  caught = 0;
  action = null;
  previousTime = null;
  finish.hidden = true;
  updateScore();

  for (let lane = 0; lane < LANES; lane++) {
    spawnFish(lane, true);
  }

  showMessage("Найди картинки, в названии которых есть звук С!");
}

window.addEventListener("resize", () => {
  for (const fish of fishes) {
    fish.width = fish.element.offsetWidth;
    fish.height = fish.element.offsetHeight;
    if (!action || action.fish !== fish) {
      fish.x = Math.max(
        -fish.width,
        Math.min(fish.x, game.clientWidth)
      );
    }
  }
});

document.getElementById("restart").addEventListener("click", resetGame);

resetGame();
requestAnimationFrame(frame);
</script>
