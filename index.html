<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Весёлая рыбалка</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #063951;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #194965;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;
  isolation: isolate;

  transform-origin: top left;

  background: #148aaf;
}

/* =====================================================
   ФОН
===================================================== */

#background {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 0;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ВОЛНЫ
===================================================== */

.wave-track {
  position: absolute;
  left: 0;

  width: 200%;
  height: 210px;

  display: flex;

  pointer-events: none;

  will-change: transform;
}

.wave-track img {
  display: block;

  width: 50%;
  height: 100%;

  flex: 0 0 50%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}

#wavesBack {
  top: 325px;
  z-index: 2;
  opacity: .60;
}

#wavesFront {
  top: 350px;
  z-index: 8;
  opacity: .82;
}

/* =====================================================
   ПАНЕЛЬ
===================================================== */

header {
  position: absolute;

  top: 30px;
  left: 42px;
  right: 42px;

  z-index: 20;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  pointer-events: none;
}

.title-card {
  padding: 20px 30px;

  border: 2px solid #ffffffb3;
  border-radius: 30px;

  background:
    linear-gradient(
      135deg,
      #fffffff2,
      #effbffe0
    );

  box-shadow:
    0 10px 30px #1354711c;
}

h1 {
  margin: 0 0 7px;
  font-size: 41px;
  letter-spacing: -.7px;
}

.subtitle {
  margin: 0;
  font-size: 23px;
}

.subtitle strong {
  display: inline-grid;
  place-items: center;

  width: 35px;
  height: 35px;

  margin-left: 4px;

  border-radius: 10px;

  background: #ffdc7e;
  color: #755022;
}

.score-card {
  min-width: 192px;

  padding: 18px 25px;

  border: 2px solid #ffffffb3;
  border-radius: 28px;

  background: #ffffffed;

  box-shadow:
    0 10px 30px #1354711c;
}

.score-label {
  margin-bottom: 7px;

  color: #618293;

  font-size: 17px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

#score {
  font-size: 35px;
  font-weight: bold;
}

.progress {
  height: 9px;

  margin-top: 13px;

  overflow: hidden;

  border-radius: 10px;

  background: #dfedf0;
}

#progressFill {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #35b9ba,
      #80d7a2
    );

  transition: width .4s ease;
}

/* =====================================================
   МАЛЬЧИК + ЛОДКА
===================================================== */

#boat {
  position: absolute;

  left: 625px;
  top: 40px;

  width: 670px;

  z-index: 7;

  pointer-events: none;

  transform-origin: 50% 75%;

  will-change: transform;
}

#boyBase {
  display: block;

  width: 100%;
  height: auto;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ТЕНЬ
===================================================== */

#boatShadow {
  position: absolute;

  left: 685px;
  top: 370px;

  width: 550px;
  height: 25px;

  border-radius: 50%;

  background: #075e7938;

  filter: blur(8px);

  z-index: 3;

  pointer-events: none;
}

/* =====================================================
   УДОЧКА
===================================================== */

#tackle {
  position: absolute;

  inset: 0;

  width: 1920px;
  height: 1080px;

  z-index: 11;

  overflow: visible;

  pointer-events: none;
}

#rod {
  fill: none;
  stroke: #73472c;
  stroke-width: 7;
  stroke-linecap: round;
}

#rodLight {
  fill: none;
  stroke: #d7a05c;
  stroke-width: 2.5;
  stroke-linecap: round;
}

#rodHandle {
  stroke: #3d4248;
  stroke-width: 12;
  stroke-linecap: round;
}

#line {
  fill: none;
  stroke: #ffffffdf;
  stroke-width: 2.4;
  stroke-linecap: round;
}

#hook {
  fill: none;
  stroke: #dce9ee;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;

  filter:
    drop-shadow(
      0 1px 1px #174760
    );
}

/* =====================================================
   РЫБКИ
===================================================== */

.fish {
  position: absolute;

  left: 0;
  top: 0;

  width: 216px;
  height: 134px;

  padding: 0;

  border: 0;

  background: transparent;

  cursor: pointer;

  z-index: 5;

  will-change: transform;
}

.fish:disabled {
  cursor: default;
}

.fish-shell {
  position: absolute;
  inset: 0;

  transform-origin: center center;

  pointer-events: none;
}

.fish.right .fish-shell {
  transform: scaleX(-1);
}

/* =====================================================
   🔒 ТЕЛО — НЕ МЕНЯТЬ
===================================================== */

.fish-body-image {
  position: absolute;

  left: 0;
  top: 0;

  width: 180px;
  height: 134px;

  object-fit: contain;

  z-index: 2;

  pointer-events: none;
  user-select: none;

  filter:
    drop-shadow(
      0 7px 5px #064d6b22
    );
}

/* =====================================================
   🔒 ХВОСТЫ — НЕ МЕНЯТЬ
===================================================== */

.fish-tail-image {
  position: absolute;

  object-fit: contain;

  z-index: 1;

  pointer-events: none;
  user-select: none;

  animation:
    tailSwim .58s
    ease-in-out
    infinite
    alternate;
}

.fish.type1 .fish-tail-image {
  width: 78px;
  height: 102px;

  left: 132px;
  top: 16px;

  transform-origin: 34% 50%;
}

.fish.type2 .fish-tail-image {
  width: 77px;
  height: 101px;

  left: 133px;
  top: 16px;

  transform-origin: 34% 50%;
}

.fish.type3 .fish-tail-image {
  width: 75px;
  height: 100px;

  left: 143px;
  top: 17px;

  transform-origin: 22% 50%;
}

@keyframes tailSwim {
  from {
    transform: rotate(-11deg);
  }

  to {
    transform: rotate(11deg);
  }
}

/* =====================================================
   КАРТИНКА В ОКОШКЕ
===================================================== */

.picture {
  position: absolute;

  left: 72px;
  top: 41px;

  width: 61px;
  height: 55px;

  display: grid;
  place-items: center;

  z-index: 4;

  line-height: 1;

  pointer-events: none;
}

.fish.right .picture {
  transform: scaleX(-1);
}

.picture img {
  display: block;

  width: 92%;
  height: 92%;

  object-fit: contain;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   НЕПРАВИЛЬНАЯ РЫБКА
===================================================== */

.fish.wrong-pull .fish-shell {
  animation:
    fishStruggle .18s
    ease-in-out
    infinite
    alternate;
}

@keyframes fishStruggle {
  from {
    transform:
      translateY(-3px)
      rotate(-3deg);
  }

  to {
    transform:
      translateY(4px)
      rotate(4deg);
  }
}

.fish.right.wrong-pull .fish-shell {
  animation-name:
    fishStruggleRight;
}

@keyframes fishStruggleRight {
  from {
    transform:
      scaleX(-1)
      translateY(-3px)
      rotate(-3deg);
  }

  to {
    transform:
      scaleX(-1)
      translateY(4px)
      rotate(4deg);
  }
}

/* =====================================================
   ОКНО МЕЖДУ РАУНДАМИ / ФИНАЛ
===================================================== */

#finish[hidden] {
  display: none;
}

#finish {
  position: absolute;

  inset: 0;

  z-index: 40;

  display: grid;
  place-items: center;

  background:
    #063a5875;

  backdrop-filter:
    blur(7px);
}

.finish-card {
  width: 588px;

  padding: 46px;

  border:
    6px solid #fff;

  border-radius: 43px;

  background:
    linear-gradient(
      #fffef5,
      #fff2d6
    );

  box-shadow:
    0 30px 96px #052c554a;

  text-align: center;
}

.finish-icon {
  font-size: 90px;
}

.finish-card h2 {
  margin:
    20px 0 14px;

  font-size: 47px;
}

.finish-card p {
  margin: 0;

  font-size: 28px;

  line-height: 1.5;
}

#finishButton {
  margin-top: 31px;

  padding: 20px 36px;

  border:
    2px solid #ffe7ab;

  border-radius: 23px;

  background:
    linear-gradient(
      #ffdc82,
      #ffc15d
    );

  color: #694619;

  box-shadow:
    0 6px 0 #da9b3e;

  font-size: 28px;

  font-weight: bold;

  cursor: pointer;
}

#finishButton:active {
  transform: translateY(3px);

  box-shadow:
    0 2px 0 #da9b3e;
}

</style>
</head>

<body>

<div id="viewport">

<main id="game">

<img
  id="background"
  src="fon_game.png"
  alt=""
  draggable="false"
>

<div id="wavesBack" class="wave-track">
  <img src="wave_back.png" alt="" draggable="false">
  <img src="wave_back.png" alt="" draggable="false">
</div>

<header>

  <div class="title-card">

    <h1>
      Весёлая рыбалка
    </h1>

    <p class="subtitle">
      Лови картинки со звуком
      <strong id="targetSound">С</strong>
    </p>

  </div>

  <div class="score-card">

    <div class="score-label">
      Наш улов
    </div>

    <div id="score">
      🐟 0 / 8
    </div>

    <div class="progress">
      <div id="progressFill"></div>
    </div>

  </div>

</header>

<div id="boatShadow"></div>

<div id="boat">

  <img
    id="boyBase"
    src="boy_open.png"
    alt="Мальчик в лодке"
    draggable="false"
  >

</div>

<div id="wavesFront" class="wave-track">
  <img src="wave_front.png" alt="" draggable="false">
  <img src="wave_front.png" alt="" draggable="false">
</div>

<svg
  id="tackle"
  viewBox="0 0 1920 1080"
  aria-hidden="true"
>

  <path id="line"></path>
  <path id="rod"></path>
  <path id="rodLight"></path>
  <line id="rodHandle"></line>
  <path id="hook"></path>

</svg>

<div
  id="finish"
  role="dialog"
  aria-modal="true"
  hidden
>

  <div class="finish-card">

    <div
      id="finishIcon"
      class="finish-icon"
    >
      🎣 🐟
    </div>

    <h2 id="finishTitle">
      Отлично порыбачили!
    </h2>

    <p id="finishText">
      Продолжим?
    </p>

    <button id="finishButton">
      Продолжить
    </button>

  </div>

</div>

</main>
</div>

<script>

"use strict";

/* =====================================================
   ВСЕ 8 КАРТИНОК С
===================================================== */

const S_CARDS = [

  {
    id: "bag",
    name: "Сумка",
    image: "raund/bag.png"
  },

  {
    id: "bus",
    name: "Автобус",
    image: "raund/bus.png"
  },

  {
    id: "cabbage",
    name: "Капуста",
    image: "raund/cabbage.png"
  },

  {
    id: "dog",
    name: "Собака",
    image: "raund/dog.png"
  },

  {
    id: "fox",
    name: "Лиса",
    image: "raund/fox.png"
  },

  {
    id: "pineapple",
    name: "Ананас",
    image: "raund/pineapple.png"
  },

  {
    id: "scooter",
    name: "Самокат",
    image: "raund/scooter.png"
  },

  {
    id: "wasp",
    name: "Оса",
    image: "raund/wasp.png"
  }

];

/* =====================================================
   ВСЕ 8 КАРТИНОК Ш
===================================================== */

const SH_CARDS = [

  {
    id: "cap",
    name: "Шапка",
    image: "raund/cap.png"
  },

  {
    id: "car",
    name: "Машина",
    image: "raund/car.png"
  },

  {
    id: "cat",
    name: "Кошка",
    image: "raund/cat.png"
  },

  {
    id: "cherry",
    name: "Вишня",
    image: "raund/cherry.png"
  },

  {
    id: "mouse",
    name: "Мышь",
    image: "raund/mouse.png"
  },

  {
    id: "pillow",
    name: "Подушка",
    image: "raund/pillow.png"
  },

  {
    id: "shower",
    name: "Душ",
    image: "raund/shower.png"
  },

  {
    id: "tire",
    name: "Шина",
    image: "raund/tire.png"
  }

];

/* =====================================================
   ДВА РАУНДА

   1 — ловим С
   2 — ловим Ш
===================================================== */

const ROUNDS = [

  {
    sound: "С",
    correctCards: S_CARDS,
    wrongCards: SH_CARDS
  },

  {
    sound: "Ш",
    correctCards: SH_CARDS,
    wrongCards: S_CARDS
  }

];

/* =====================================================
   ВИДЫ РЫБ
===================================================== */

const FISH_TYPES = [

  {
    type: "type1",
    body: "fish/fish1_body.png",
    tail: "fish/fish1_tail.png"
  },

  {
    type: "type2",
    body: "fish/fish2_body.png",
    tail: "fish/fish2_tail.png"
  },

  {
    type: "type3",
    body: "fish/fish3_body.png",
    tail: "fish/fish3_tail.png"
  }

];

/* =====================================================
   РАЗМЕРЫ
===================================================== */

const WIDTH = 1920;
const HEIGHT = 1080;

const FISH_WIDTH = 216;
const FISH_HEIGHT = 134;

const LANES = [
  500,
  690,
  855
];

const BOAT_X = 625;
const BOAT_WIDTH = 670;

const WATER_Y = 390;

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
  document.getElementById("game");

const viewport =
  document.getElementById("viewport");

const wavesBack =
  document.getElementById("wavesBack");

const wavesFront =
  document.getElementById("wavesFront");

const boat =
  document.getElementById("boat");

const boyBase =
  document.getElementById("boyBase");

const rod =
  document.getElementById("rod");

const rodLight =
  document.getElementById("rodLight");

const rodHandle =
  document.getElementById("rodHandle");

const line =
  document.getElementById("line");

const hook =
  document.getElementById("hook");

const score =
  document.getElementById("score");

const progressFill =
  document.getElementById("progressFill");

const targetSound =
  document.getElementById("targetSound");

const finish =
  document.getElementById("finish");

const finishIcon =
  document.getElementById("finishIcon");

const finishTitle =
  document.getElementById("finishTitle");

const finishText =
  document.getElementById("finishText");

const finishButton =
  document.getElementById("finishButton");

/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let currentRoundIndex =
  0;

let fishes =
  [];

let caughtCorrect =
  new Set();

let lastWrongId =
  null;

let action =
  null;

let previousTime =
  null;

let clock =
  0;

let boatHeight =
  450;

let spawnNumber =
  0;

/* =====================================================
   ТЕКУЩИЙ РАУНД
===================================================== */

function getRound() {

  return ROUNDS[
    currentRoundIndex
  ];

}

function getTotalCorrect() {

  return getRound()
    .correctCards
    .length;

}

/* =====================================================
   МАСШТАБ
===================================================== */

function resizeGame() {

  const scale =
    Math.min(

      document.documentElement.clientWidth /
      WIDTH,

      document.documentElement.clientHeight /
      HEIGHT

    );

  viewport.style.width =
    `${WIDTH * scale}px`;

  viewport.style.height =
    `${HEIGHT * scale}px`;

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   РАЗМЕР ЛОДКИ
===================================================== */

function measureBoat() {

  if (!boyBase.naturalWidth) {
    return;
  }

  boatHeight =

    BOAT_WIDTH *

    boyBase.naturalHeight /

    boyBase.naturalWidth;

  boat.style.height =
    `${boatHeight}px`;

}

boyBase.addEventListener(
  "load",
  measureBoat
);

if (boyBase.complete) {
  measureBoat();
}

/* =====================================================
   ПОМОЩНИКИ
===================================================== */

function randomItem(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}

function mix(
  a,
  b,
  t
) {

  return (
    a +
    (b - a) * t
  );

}

function smooth(
  t
) {

  return (
    t *
    t *
    (3 - 2 * t)
  );

}

/* =====================================================
   СЧЁТ
===================================================== */

function updateScore() {

  const caught =
    caughtCorrect.size;

  const total =
    getTotalCorrect();

  score.textContent =
    `🐟 ${caught} / ${total}`;

  progressFill.style.width =

    `${
      total
        ? caught /
          total *
          100
        : 0
    }%`;

}

/* =====================================================
   АКТИВНЫЕ ПРАВИЛЬНЫЕ КАРТИНКИ
===================================================== */

function getActiveCorrectIds() {

  const result =
    new Set();

  for (
    const fish
    of fishes
  ) {

    if (
      !fish.removed &&
      fish.card.correct
    ) {

      result.add(
        fish.card.id
      );

    }

  }

  return result;

}

/* =====================================================
   ПРАВИЛЬНАЯ КАРТИНКА

   Пойманные больше не появляются.
   Одновременно одна правильная
   картинка тоже не дублируется.
===================================================== */

function getCorrectCard() {

  const round =
    getRound();

  const activeCorrect =
    getActiveCorrectIds();

  const available =

    round.correctCards.filter(

      card =>

        !caughtCorrect.has(
          card.id
        ) &&

        !activeCorrect.has(
          card.id
        )

    );

  if (!available.length) {
    return null;
  }

  const card =
    randomItem(
      available
    );

  return {

    ...card,
    correct: true

  };

}

/* =====================================================
   НЕПРАВИЛЬНАЯ КАРТИНКА

   Может повторяться,
   но не ставим ту же самую
   два раза подряд.
===================================================== */

function getWrongCard() {

  const round =
    getRound();

  let available =

    round.wrongCards.filter(

      card =>
        card.id !==
        lastWrongId

    );

  if (!available.length) {

    available =
      [...round.wrongCards];

  }

  const selected =
    randomItem(
      available
    );

  lastWrongId =
    selected.id;

  return {

    ...selected,
    correct: false

  };

}

/* =====================================================
   СЛЕДУЮЩАЯ КАРТИНКА
===================================================== */

function getNextCard(
  forceCorrect = false
) {

  const correct =
    getCorrectCard();

  if (
    forceCorrect &&
    correct
  ) {

    return correct;

  }

  /*
    60% — правильная,
    40% — отвлекающая.
  */

  if (
    correct &&
    Math.random() < .60
  ) {

    return correct;

  }

  return getWrongCard();

}

/* =====================================================
   ВОЛНЫ
===================================================== */

function moveWaves() {

  const backDistance =

    (
      clock *
      WIDTH /
      18
    ) % WIDTH;

  const frontDistance =

    (
      clock *
      WIDTH /
      12
    ) % WIDTH;

  const backBob =

    Math.sin(

      clock *
      Math.PI *
      2 /
      4

    ) * 4;

  const frontBob =

    Math.sin(

      clock *
      Math.PI *
      2 /
      3

    ) * 3.5;

  wavesBack.style.transform = `

    translate3d(
      ${-backDistance}px,
      ${backBob}px,
      0
    )

  `;

  wavesFront.style.transform = `

    translate3d(
      ${-WIDTH + frontDistance}px,
      ${frontBob}px,
      0
    )

  `;

}

/* =====================================================
   ЛОДКА
===================================================== */

function getBoatPose() {

  const bob =

    Math.sin(
      clock * 1.5
    ) * 3;

  const top =

    WATER_Y -

    boatHeight *
    .72 +

    bob;

  boat.style.top =
    `${top}px`;

  boat.style.transform =

    `rotate(${
      Math.sin(
        clock * 1.25
      ) * .5
    }deg)`;

  const handX =

    BOAT_X +

    BOAT_WIDTH *
    .575;

  const handY =

    top +

    boatHeight *
    .445;

  return {

    hand: {

      x:
        handX,

      y:
        handY

    },

    tip: {

      x:
        handX +
        300,

      y:
        handY -
        145

    },

    /*
      ТОЧКА У НОГ МАЛЬЧИКА
    */

    landing: {

      x:
        BOAT_X +
        BOAT_WIDTH *
        .565,

      y:
        top +
        boatHeight *
        .72

    }

  };

}

/* =====================================================
   УДОЧКА
===================================================== */

function drawRod(
  pose,
  bend = 0
) {

  const {
    hand,
    tip
  } = pose;

  const startX =
    hand.x + 3;

  const startY =
    hand.y - 5;

  const path = `

    M ${startX}
      ${startY}

    Q ${hand.x + 128}
      ${hand.y - 187 + bend * .35}

      ${tip.x}
      ${tip.y + bend}

  `;

  rod.setAttribute(
    "d",
    path
  );

  rodLight.setAttribute(
    "d",
    path
  );

  rodHandle.setAttribute(
    "x1",
    hand.x - 8
  );

  rodHandle.setAttribute(
    "y1",
    hand.y + 15
  );

  rodHandle.setAttribute(
    "x2",
    hand.x + 5
  );

  rodHandle.setAttribute(
    "y2",
    hand.y - 6
  );

  return {

    x:
      tip.x,

    y:
      tip.y +
      bend

  };

}

/* =====================================================
   ЛЕСКА
===================================================== */

function drawLine(
  tip,
  end,
  showHook = true
) {

  const curve =

    Math.min(

      50,

      Math.abs(
        end.y -
        tip.y
      ) * .08

    );

  line.setAttribute(

    "d",

    `

      M ${tip.x}
        ${tip.y}

      Q ${tip.x + curve}
        ${(tip.y + end.y) / 2}

        ${end.x}
        ${end.y}

    `

  );

  hook.style.display =

    showHook
      ? ""
      : "none";

  hook.setAttribute(

    "d",

    `

      M ${end.x}
        ${end.y - 24}

      L ${end.x}
        ${end.y - 8}

      Q ${end.x}
        ${end.y + 1}

        ${end.x - 8}
        ${end.y}

      Q ${end.x - 18}
        ${end.y - 1}

        ${end.x - 16}
        ${end.y - 12}

      L ${end.x - 11}
        ${end.y - 7}

    `

  );

}

/* =====================================================
   СОЗДАНИЕ РЫБКИ
===================================================== */

function spawnFish(
  lane,
  initial = false,
  forceCorrect = false
) {

  const card =
    getNextCard(
      forceCorrect
    );

  if (!card) {
    return;
  }

  const direction =

    spawnNumber++ %
    2 === 0

      ? 1

      : -1;

  const fishType =

    randomItem(
      FISH_TYPES
    );

  const element =

    document.createElement(
      "button"
    );

  element.type =
    "button";

  element.className =

    `fish ${fishType.type}` +

    (
      direction === 1
        ? " right"
        : ""
    );

  element.setAttribute(
    "aria-label",
    card.name
  );

  element.innerHTML = `

    <span
      class="fish-shell"
    >

      <img
        class="fish-tail-image"
        src="${fishType.tail}"
        alt=""
        draggable="false"
      >

      <img
        class="fish-body-image"
        src="${fishType.body}"
        alt=""
        draggable="false"
      >

      <span
        class="picture"
        aria-hidden="true"
      >

        <img
          src="${card.image}"
          alt=""
          draggable="false"
        >

      </span>

    </span>

  `;

  const initialPositions = [
    240,
    1230,
    700
  ];

  const fish = {

    card,

    element,

    lane,

    direction,

    x:

      initial

        ? initialPositions[
            lane
          ]

        : direction === 1

          ? -FISH_WIDTH -
            30

          : WIDTH +
            30,

    y:

      LANES[
        lane
      ],

    speed:

      78 +

      Math.random() *
      24,

    phase:

      Math.random() *
      Math.PI *
      2,

    removed:
      false

  };

  element.disabled =

    Boolean(
      action
    ) ||

    !finish.hidden;

  element.addEventListener(

    "click",

    () =>
      selectFish(
        fish
      )

  );

  game.appendChild(
    element
  );

  fishes.push(
    fish
  );

  renderFish(
    fish
  );

}

/* =====================================================
   РЕНДЕР
===================================================== */

function renderFish(
  fish,
  scale = 1,
  rotation = 0
) {

  fish.element.style.transform = `

    translate(
      ${fish.x}px,
      ${fish.y}px
    )

    rotate(
      ${rotation}deg
    )

    scale(
      ${scale}
    )

  `;

}

/* =====================================================
   ВКЛЮЧЕНИЕ РЫБ
===================================================== */

function setFishEnabled(
  enabled
) {

  for (
    const fish
    of fishes
  ) {

    fish.element.disabled =
      !enabled;

  }

}

/* =====================================================
   ВЫБОР РЫБЫ
===================================================== */

function selectFish(
  fish
) {

  if (
    action ||
    fish.removed ||
    !finish.hidden
  ) {

    return;

  }

  setFishEnabled(
    false
  );

  fish.element.style.zIndex =
    "10";

  if (
    !fish.card.correct
  ) {

    action = {

      type:
        "wrong",

      fish,

      stage:
        "hook",

      elapsed:
        0,

      startX:
        fish.x,

      startY:
        fish.y

    };

    return;

  }

  action = {

    type:
      "correct",

    fish,

    stage:
      "lower",

    elapsed:
      0,

    startX:
      fish.x,

    startY:
      fish.y

  };

}

/* =====================================================
   ПРАВИЛЬНАЯ РЫБКА
===================================================== */

function animateCorrectCatch(
  dt,
  pose
) {

  const current =
    action;

  const fish =
    current.fish;

  current.elapsed +=
    dt;

  /* -----------------------------------
     1. КРЮЧОК К РЫБКЕ
  ----------------------------------- */

  if (
    current.stage ===
    "lower"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          .72,
          1
        )

      );

    const tip =

      drawRod(
        pose,
        t * 12
      );

    drawLine(

      tip,

      {

        x:

          mix(

            tip.x + 6,

            fish.x +
            FISH_WIDTH /
            2,

            t

          ),

        y:

          mix(

            tip.y + 58,

            fish.y +
            22,

            t

          )

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "lift";

      current.elapsed =
        0;

    }

    return;

  }

  /* -----------------------------------
     2. ДОЛЕТАЕТ ДО НОГ МАЛЬЧИКА
  ----------------------------------- */

  if (
    current.stage ===
    "lift"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          1.55,
          1
        )

      );

    const targetX =

      pose.landing.x -
      FISH_WIDTH /
      2;

    const targetY =

      pose.landing.y -
      FISH_HEIGHT /
      2;

    fish.x =

      mix(

        current.startX,

        targetX,

        t

      );

    fish.y =

      mix(

        current.startY,

        targetY,

        t

      );

    const scale =

      mix(
        1,
        .58,
        t
      );

    renderFish(

      fish,

      scale,

      Math.sin(
        t *
        Math.PI
      ) * 4

    );

    fish.element.style.opacity =
      "1";

    const tip =

      drawRod(

        pose,

        12 +

        Math.sin(
          t *
          Math.PI
        ) * 13

      );

    drawLine(

      tip,

      {

        x:
          fish.x +
          FISH_WIDTH /
          2,

        y:
          fish.y +
          22

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "vanish";

      current.elapsed =
        0;

      current.vanishX =
        fish.x;

      current.vanishY =
        fish.y;

      fish.element.style.zIndex =
        "6";

    }

    return;

  }

  /* -----------------------------------
     3. МЯГКО ИСЧЕЗАЕТ НА МЕСТЕ
  ----------------------------------- */

  if (
    current.stage ===
    "vanish"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          .55,
          1
        )

      );

    fish.x =
      current.vanishX;

    fish.y =
      current.vanishY;

    const scale =

      mix(
        .58,
        .35,
        t
      );

    renderFish(

      fish,

      scale,

      0

    );

    fish.element.style.opacity =

      String(
        1 -
        t
      );

    const tip =

      drawRod(

        pose,

        mix(
          12,
          0,
          t
        )

      );

    drawLine(

      tip,

      {

        x:
          tip.x +
          6,

        y:
          tip.y +
          58

      }

    );

    if (
      t >= 1
    ) {

      finishCatch(
        fish
      );

    }

    return;

  }

}

/* =====================================================
   НЕПРАВИЛЬНАЯ РЫБКА
===================================================== */

function animateWrongCatch(
  dt,
  pose
) {

  const current =
    action;

  const fish =
    current.fish;

  current.elapsed +=
    dt;

  /* -----------------------------------
     1. КРЮЧОК К РЫБКЕ
  ----------------------------------- */

  if (
    current.stage ===
    "hook"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          .58,
          1
        )

      );

    const tip =

      drawRod(
        pose,
        t * 9
      );

    drawLine(

      tip,

      {

        x:

          mix(

            tip.x + 6,

            fish.x +
            FISH_WIDTH /
            2,

            t

          ),

        y:

          mix(

            tip.y + 58,

            fish.y +
            25,

            t

          )

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "pull";

      current.elapsed =
        0;

      current.pullStartY =
        fish.y;

      fish.element.classList.add(
        "wrong-pull"
      );

    }

    return;

  }

  /* -----------------------------------
     2. ТЯНЕТ ВНИЗ
  ----------------------------------- */

  if (
    current.stage ===
    "pull"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          .82,
          1
        )

      );

    fish.y =

      current.pullStartY +

      t * 105 +

      Math.sin(
        current.elapsed *
        23
      ) * 7;

    fish.x +=

      fish.direction *
      dt *
      24;

    renderFish(
      fish
    );

    const bend =

      18 +

      t * 115 +

      Math.sin(
        current.elapsed *
        18
      ) * 6;

    const tip =

      drawRod(
        pose,
        bend
      );

    drawLine(

      tip,

      {

        x:
          fish.x +
          FISH_WIDTH /
          2,

        y:
          fish.y +
          25

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "snap";

      current.elapsed =
        0;

      current.snapX =
        fish.x;

      current.snapY =
        fish.y;

      fish.element.classList.remove(
        "wrong-pull"
      );

    }

    return;

  }

  /* -----------------------------------
     3. СРЫВАЕТСЯ
  ----------------------------------- */

  if (
    current.stage ===
    "snap"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed /
          .38,
          1
        )

      );

    fish.x =

      current.snapX +

      fish.direction *
      t *
      70;

    fish.y =

      current.snapY -

      t * 8;

    renderFish(

      fish,

      1,

      fish.direction *
      -t * 4

    );

    const bend =

      mix(
        130,
        30,
        t
      );

    const tip =

      drawRod(
        pose,
        bend
      );

    const looseEnd = {

      x:

        mix(

          current.snapX +
          FISH_WIDTH /
          2,

          tip.x +
          12,

          t

        ),

      y:

        mix(

          current.snapY +
          25,

          tip.y +
          90,

          t

        )

    };

    drawLine(

      tip,

      looseEnd

    );

    if (
      t >= 1
    ) {

      current.stage =
        "recover";

      current.elapsed =
        0;

      current.recoverX =
        fish.x;

      current.recoverY =
        fish.y;

    }

    return;

  }

  /* -----------------------------------
     4. ПЛАВНОЕ ВОЗВРАЩЕНИЕ
  ----------------------------------- */

  if (
    current.stage ===
    "recover"
  ) {

    const duration =
      1.05;

    const rawT =

      Math.min(
        current.elapsed /
        duration,
        1
      );

    const t =
      smooth(
        rawT
      );

    fish.x =

      current.recoverX +

      fish.direction *

      fish.speed *

      current.elapsed;

    const normalY =

      LANES[
        fish.lane
      ] +

      Math.sin(

        clock *
        1.7 +

        fish.phase

      ) * 11;

    fish.y =

      mix(

        current.recoverY,

        normalY,

        t

      );

    const rotation =

      fish.direction *

      -4 *

      (1 - t);

    renderFish(

      fish,

      1,

      rotation

    );

    const bend =

      mix(
        30,
        0,
        t
      );

    const tip =

      drawRod(
        pose,
        bend
      );

    drawLine(

      tip,

      {

        x:

          tip.x +

          6 +

          Math.sin(
            clock *
            1.8
          ) * 4,

        y:

          tip.y +
          58

      }

    );

    if (
      rawT >= 1
    ) {

      fish.y =

        LANES[
          fish.lane
        ] +

        Math.sin(

          clock *
          1.7 +

          fish.phase

        ) * 11;

      renderFish(
        fish
      );

      fish.element.style.zIndex =
        "5";

      action =
        null;

      setFishEnabled(
        true
      );

    }

    return;

  }

}

/* =====================================================
   ПРАВИЛЬНАЯ РЫБКА ПОЙМАНА
===================================================== */

function finishCatch(
  fish
) {

  caughtCorrect.add(
    fish.card.id
  );

  fish.removed =
    true;

  fish.element.remove();

  fishes =

    fishes.filter(

      item =>
        item !== fish

    );

  updateScore();

  action =
    null;

  if (
    caughtCorrect.size ===
    getTotalCorrect()
  ) {

    /*
      РАУНД 1 ЗАКОНЧЕН
    */

    if (
      currentRoundIndex === 0
    ) {

      showRoundComplete();

    }

    /*
      РАУНД 2 ЗАКОНЧЕН
    */

    else {

      showGameComplete();

    }

    return;

  }

  spawnFish(
    fish.lane
  );

  setFishEnabled(
    true
  );

}

/* =====================================================
   ОКНО ПОСЛЕ ПЕРВОГО РАУНДА
===================================================== */

function showRoundComplete() {

  setFishEnabled(
    false
  );

  finishIcon.textContent =
    "🎣 🐟";

  finishTitle.textContent =
    "Отлично порыбачили!";

  finishText.textContent =
    "Продолжим?";

  finishButton.textContent =
    "Продолжить";

  finishButton.dataset.action =
    "next-round";

  finish.hidden =
    false;

  finishButton.focus();

}

/* =====================================================
   ФИНАЛ ВСЕЙ ИГРЫ
===================================================== */

function showGameComplete() {

  setFishEnabled(
    false
  );

  finishIcon.textContent =
    "🏆 🎣 🐟";

  finishTitle.textContent =
    "Отличный улов!";

  finishText.innerHTML =
    "Все картинки со звуками С и Ш<br>пойманы!";

  finishButton.textContent =
    "Рыбачить ещё раз";

  finishButton.dataset.action =
    "restart";

  finish.hidden =
    false;

  finishButton.focus();

}

/* =====================================================
   УДАЛЯЕМ ТЕКУЩИХ РЫБ
===================================================== */

function clearFishes() {

  for (
    const fish
    of fishes
  ) {

    fish.element.remove();

  }

  fishes =
    [];

}

/* =====================================================
   ЗАПУСК КОНКРЕТНОГО РАУНДА
===================================================== */

function startRound(
  roundIndex
) {

  clearFishes();

  currentRoundIndex =
    roundIndex;

  caughtCorrect =
    new Set();

  lastWrongId =
    null;

  action =
    null;

  spawnNumber =
    0;

  previousTime =
    null;

  finish.hidden =
    true;

  /*
    Меняем букву сверху.
  */

  targetSound.textContent =
    getRound().sound;

  updateScore();

  /*
    На старте гарантируем,
    что хотя бы одна правильная
    рыбка уже есть на экране.
  */

  spawnFish(
    0,
    true,
    true
  );

  spawnFish(
    1,
    true
  );

  spawnFish(
    2,
    true
  );

  const pose =
    getBoatPose();

  const tip =
    drawRod(
      pose
    );

  drawLine(

    tip,

    {

      x:
        tip.x + 6,

      y:
        tip.y + 58

    }

  );

}

/* =====================================================
   ОБЫЧНОЕ ДВИЖЕНИЕ
===================================================== */

function moveFishes(
  dt
) {

  for (
    const fish
    of [...fishes]
  ) {

    if (
      action &&
      action.fish === fish
    ) {

      continue;

    }

    fish.x +=

      fish.direction *

      fish.speed *

      dt;

    fish.y =

      LANES[
        fish.lane
      ] +

      Math.sin(

        clock *
        1.7 +

        fish.phase

      ) * 11;

    renderFish(
      fish
    );

    const outside =

      fish.direction === 1

        ? fish.x >
          WIDTH +
          35

        : fish.x <
          -FISH_WIDTH -
          35;

    if (
      outside
    ) {

      fish.removed =
        true;

      fish.element.remove();

      fishes =

        fishes.filter(

          item =>
            item !== fish

        );

      spawnFish(
        fish.lane
      );

    }

  }

}

/* =====================================================
   ГЛАВНЫЙ ЦИКЛ
===================================================== */

function frame(
  timestamp
) {

  const dt =

    previousTime === null

      ? 0

      : Math.min(

          (
            timestamp -
            previousTime
          ) / 1000,

          .05

        );

  previousTime =
    timestamp;

  if (
    finish.hidden &&
    !document.hidden
  ) {

    clock +=
      dt;

    moveWaves();

    const pose =
      getBoatPose();

    moveFishes(
      dt
    );

    if (
      action
    ) {

      if (
        action.type ===
        "correct"
      ) {

        animateCorrectCatch(
          dt,
          pose
        );

      } else {

        animateWrongCatch(
          dt,
          pose
        );

      }

    } else {

      const tip =
        drawRod(
          pose
        );

      drawLine(

        tip,

        {

          x:

            tip.x +

            6 +

            Math.sin(
              clock *
              1.8
            ) * 4,

          y:

            tip.y +
            58

        }

      );

    }

  }

  requestAnimationFrame(
    frame
  );

}

/* =====================================================
   ВОЗВРАЩЕНИЕ НА ВКЛАДКУ
===================================================== */

document.addEventListener(

  "visibilitychange",

  () => {

    previousTime =
      null;

  }

);

/* =====================================================
   КНОПКА ОКНА
===================================================== */

finishButton.addEventListener(

  "click",

  () => {

    const actionType =
      finishButton.dataset.action;

    /*
      После первого раунда
      запускаем второй.
    */

    if (
      actionType ===
      "next-round"
    ) {

      startRound(
        1
      );

      return;

    }

    /*
      После второго —
      начинаем всю игру заново.
    */

    if (
      actionType ===
      "restart"
    ) {

      clock =
        0;

      moveWaves();

      startRound(
        0
      );

    }

  }

);

/* =====================================================
   СТАРТ ИГРЫ
===================================================== */

moveWaves();

startRound(
  0
);

requestAnimationFrame(
  frame
);

</script>

</body>
</html>
