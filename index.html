<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Весёлая рыбалка</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #063951;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #194965;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;
  isolation: isolate;

  transform-origin: top left;

  background: #148aaf;
}

/* =====================================================
   ФОН
===================================================== */

#background {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 0;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ВОЛНЫ
===================================================== */

.wave-track {
  position: absolute;
  left: 0;

  width: 200%;
  height: 210px;

  display: flex;

  pointer-events: none;

  will-change: transform;
}

.wave-track img {
  display: block;

  width: 50%;
  height: 100%;

  flex: 0 0 50%;

  object-fit: fill;

  pointer-events: none;
  user-select: none;
}

#wavesBack {
  top: 325px;
  z-index: 2;
  opacity: .60;

  animation:
    wavesBackMove 18s linear infinite,
    wavesBackBob 4s ease-in-out infinite;
}

#wavesFront {
  top: 350px;
  z-index: 8;
  opacity: .82;

  animation:
    wavesFrontMove 12s linear infinite,
    wavesFrontBob 3s ease-in-out infinite;
}

@keyframes wavesBackMove {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

@keyframes wavesFrontMove {
  from {
    transform: translateX(-50%);
  }

  to {
    transform: translateX(0);
  }
}

@keyframes wavesBackBob {
  0%,
  100% {
    margin-top: 0;
  }

  50% {
    margin-top: 8px;
  }
}

@keyframes wavesFrontBob {
  0%,
  100% {
    margin-top: 0;
  }

  50% {
    margin-top: -7px;
  }
}

/* =====================================================
   ПАНЕЛЬ
===================================================== */

header {
  position: absolute;

  top: 30px;
  left: 42px;
  right: 42px;

  z-index: 20;

  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  pointer-events: none;
}

.title-card {
  padding: 20px 30px;

  border: 2px solid #ffffffb3;
  border-radius: 30px;

  background:
    linear-gradient(
      135deg,
      #fffffff2,
      #effbffe0
    );

  box-shadow:
    0 10px 30px #1354711c;
}

h1 {
  margin: 0 0 7px;

  font-size: 41px;

  letter-spacing: -.7px;
}

.subtitle {
  margin: 0;

  font-size: 23px;
}

.subtitle strong {
  display: inline-grid;
  place-items: center;

  width: 35px;
  height: 35px;

  margin-left: 4px;

  border-radius: 10px;

  background: #ffdc7e;

  color: #755022;
}

.score-card {
  min-width: 192px;

  padding: 18px 25px;

  border: 2px solid #ffffffb3;
  border-radius: 28px;

  background: #ffffffed;

  box-shadow:
    0 10px 30px #1354711c;
}

.score-label {
  margin-bottom: 7px;

  color: #618293;

  font-size: 17px;

  letter-spacing: 2px;

  text-transform: uppercase;
}

#score {
  font-size: 35px;
  font-weight: bold;
}

.progress {
  height: 9px;

  margin-top: 13px;

  overflow: hidden;

  border-radius: 10px;

  background: #dfedf0;
}

#progressFill {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #35b9ba,
      #80d7a2
    );

  transition: width .4s ease;
}

/* =====================================================
   МАЛЬЧИК + ЛОДКА
===================================================== */

#boat {
  position: absolute;

  left: 625px;
  top: 40px;

  width: 670px;

  z-index: 7;

  pointer-events: none;

  transform-origin: 50% 75%;

  will-change: transform;
}

#boy {
  display: block;

  width: 100%;
  height: auto;

  pointer-events: none;
  user-select: none;
}

/* =====================================================
   ТЕНЬ ЛОДКИ
===================================================== */

#boatShadow {
  position: absolute;

  left: 685px;
  top: 370px;

  width: 550px;
  height: 25px;

  border-radius: 50%;

  background: #075e7938;

  filter: blur(8px);

  z-index: 3;

  pointer-events: none;
}

/* =====================================================
   УДОЧКА
===================================================== */

#tackle {
  position: absolute;

  inset: 0;

  width: 1920px;
  height: 1080px;

  z-index: 11;

  overflow: visible;

  pointer-events: none;
}

#rod {
  fill: none;

  stroke: #73472c;

  stroke-width: 7;

  stroke-linecap: round;
}

#rodLight {
  fill: none;

  stroke: #d7a05c;

  stroke-width: 2.5;

  stroke-linecap: round;
}

#rodHandle {
  stroke: #3d4248;

  stroke-width: 12;

  stroke-linecap: round;
}

#line {
  fill: none;

  stroke: #ffffffdf;

  stroke-width: 2.4;

  stroke-linecap: round;
}

#hook {
  fill: none;

  stroke: #dce9ee;

  stroke-width: 5;

  stroke-linecap: round;
  stroke-linejoin: round;

  filter:
    drop-shadow(
      0 1px 1px #174760
    );
}

/* =====================================================
   НОВЫЕ РЫБКИ
===================================================== */

.fish {
  position: absolute;

  left: 0;
  top: 0;

  width: 245px;
  height: 160px;

  padding: 0;

  border: 0;

  background: transparent;

  cursor: pointer;

  z-index: 5;

  will-change: transform;
}

.fish:disabled {
  cursor: default;
}

/* Вся графика рыбы */

.fish-art {
  position: absolute;

  inset: 0;

  width: 245px;
  height: 160px;

  pointer-events: none;

  filter:
    drop-shadow(
      0 7px 5px #064d6b22
    );
}

/* Тело */

.fish-body {
  position: absolute;

  left: 0;
  top: 0;

  width: 190px;
  height: 160px;

  object-fit: contain;

  z-index: 2;

  pointer-events: none;
  user-select: none;
}

/* Хвост */

.fish-tail {
  position: absolute;

  left: 162px;
  top: 35px;

  width: 82px;
  height: 92px;

  object-fit: contain;

  z-index: 1;

  pointer-events: none;
  user-select: none;

  transform-origin: 8% 50%;

  animation:
    tailWag .55s ease-in-out infinite alternate;
}

/* Немного разная скорость хвостов */

.fish.type-2 .fish-tail {
  animation-duration: .48s;
}

.fish.type-3 .fish-tail {
  animation-duration: .62s;
}

/* Движение хвоста */

@keyframes tailWag {

  from {
    transform:
      rotate(-11deg)
      scaleX(.96);
  }

  to {
    transform:
      rotate(11deg)
      scaleX(1.03);
  }

}

/* =====================================================
   НАСТРОЙКИ КАЖДОЙ РЫБКИ
   Здесь потом точно подгоним места соединения
===================================================== */

/* Рыбка 1 */

.fish.type-1 .fish-body {
  left: 0px;
  top: 0px;

  width: 190px;
}

.fish.type-1 .fish-tail {
  left: 158px;
  top: 34px;

  width: 86px;
  height: 94px;
}

/* Рыбка 2 */

.fish.type-2 .fish-body {
  left: 0px;
  top: 0px;

  width: 190px;
}

.fish.type-2 .fish-tail {
  left: 158px;
  top: 34px;

  width: 86px;
  height: 94px;
}

/* Рыбка 3 */

.fish.type-3 .fish-body {
  left: 0px;
  top: 0px;

  width: 190px;
}

.fish.type-3 .fish-tail {
  left: 158px;
  top: 34px;

  width: 86px;
  height: 94px;
}

/* =====================================================
   РАЗВОРОТ РЫБЫ
===================================================== */

.fish.right .fish-art {
  transform: scaleX(-1);
}

/* =====================================================
   КАРТИНКА В ОКОШКЕ
===================================================== */

.picture {
  position: absolute;

  left: 72px;
  top: 47px;

  width: 70px;
  height: 65px;

  display: grid;
  place-items: center;

  z-index: 4;

  background: transparent;

  border: none;

  box-shadow: none;

  font-size: 48px;

  line-height: 1;

  pointer-events: none;
}

/*
При развороте рыбы само окошко остаётся
на нужном месте, а картинка не зеркалится.
*/

.fish.right .picture {
  left: 72px;
}

.picture img {
  width: 88%;
  height: 88%;

  object-fit: contain;

  pointer-events: none;
}

/* Ошибка */

.fish.wrong .fish-art {
  animation:
    wobble .4s ease;
}

@keyframes wobble {

  25% {
    transform:
      rotate(-7deg);
  }

  75% {
    transform:
      rotate(7deg);
  }

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

#message {
  position: absolute;

  bottom: 30px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 20;

  max-width: 1320px;

  padding: 17px 31px;

  border:
    2px solid #ffffffa6;

  border-radius: 30px;

  background:
    #fffdf0ef;

  box-shadow:
    0 7px 24px #12445c24;

  text-align: center;

  font-size: 25px;

  white-space: nowrap;

  pointer-events: none;
}

/* =====================================================
   ФИНАЛ
===================================================== */

#finish[hidden] {
  display: none;
}

#finish {
  position: absolute;

  inset: 0;

  z-index: 40;

  display: grid;
  place-items: center;

  background:
    #063a5875;

  backdrop-filter:
    blur(7px);
}

.finish-card {
  width: 588px;

  padding: 46px;

  border: 6px solid #fff;

  border-radius: 43px;

  background:
    linear-gradient(
      #fffef5,
      #fff2d6
    );

  box-shadow:
    0 30px 96px #052c554a;

  text-align: center;
}

.finish-icon {
  font-size: 90px;
}

.finish-card h2 {
  margin:
    20px 0 14px;

  font-size: 47px;
}

.finish-card p {
  margin: 0;

  font-size: 28px;

  line-height: 1.5;
}

#restart {
  margin-top: 31px;

  padding: 20px 36px;

  border: 2px solid #ffe7ab;

  border-radius: 23px;

  background:
    linear-gradient(
      #ffdc82,
      #ffc15d
    );

  color: #694619;

  box-shadow:
    0 6px 0 #da9b3e;

  font-size: 28px;

  font-weight: bold;

  cursor: pointer;
}

#restart:active {
  transform:
    translateY(3px);

  box-shadow:
    0 2px 0 #da9b3e;
}

</style>
</head>

<body>

<div id="viewport">

<main id="game">

<img
  id="background"
  src="fon_game.png"
  alt=""
  draggable="false"
>

<div
  id="wavesBack"
  class="wave-track"
>

  <img
    src="wave_back.png"
    alt=""
    draggable="false"
  >

  <img
    src="wave_back.png"
    alt=""
    draggable="false"
  >

</div>

<header>

  <div class="title-card">

    <h1>
      Весёлая рыбалка
    </h1>

    <p class="subtitle">

      Лови картинки со звуком

      <strong>
        С
      </strong>

    </p>

  </div>

  <div class="score-card">

    <div class="score-label">
      Наш улов
    </div>

    <div id="score">
      🐟 0 / 6
    </div>

    <div class="progress">

      <div
        id="progressFill"
      ></div>

    </div>

  </div>

</header>

<div id="boatShadow"></div>

<!-- =================================================
     ТЕПЕРЬ ТОЛЬКО ГОТОВЫЙ МАЛЬЧИК
================================================== -->

<div id="boat">

  <img
    id="boy"
    src="boy_open.png"
    alt="Мальчик в лодке"
    draggable="false"
  >

</div>

<div
  id="wavesFront"
  class="wave-track"
>

  <img
    src="wave_front.png"
    alt=""
    draggable="false"
  >

  <img
    src="wave_front.png"
    alt=""
    draggable="false"
  >

</div>

<svg
  id="tackle"
  viewBox="0 0 1920 1080"
  aria-hidden="true"
>

  <path id="line"></path>

  <path id="rod"></path>

  <path id="rodLight"></path>

  <line id="rodHandle"></line>

  <path id="hook"></path>

</svg>

<div
  id="message"
  role="status"
>
  Найди рыбку с картинкой на звук С
</div>

<div
  id="finish"
  role="dialog"
  aria-modal="true"
  hidden
>

  <div class="finish-card">

    <div class="finish-icon">
      🎣 🐟
    </div>

    <h2>
      Отличный улов!
    </h2>

    <p>
      Все рыбки со звуком С
      <br>
      оказались в лодке!
    </p>

    <button id="restart">
      Рыбачить ещё раз
    </button>

  </div>

</div>

</main>
</div>

<script>

"use strict";

/* =====================================================
   ТРИ ВИДА НОВЫХ РЫБ
===================================================== */

const FISH_TYPES = [

  {
    body:
      "fish/fish1_body.png",

    tail:
      "fish/fish1_tail.png"
  },

  {
    body:
      "fish/fish2_body.png",

    tail:
      "fish/fish2_tail.png"
  },

  {
    body:
      "fish/fish3_body.png",

    tail:
      "fish/fish3_tail.png"
  }

];

/* =====================================================
   КАРТОЧКИ
===================================================== */

const CARDS = [

  {
    name: "Сок",
    emoji: "🧃",
    correct: true
  },

  {
    name: "Сова",
    emoji: "🦉",
    correct: true
  },

  {
    name: "Сыр",
    emoji: "🧀",
    correct: true
  },

  {
    name: "Сумка",
    emoji: "👜",
    correct: true
  },

  {
    name: "Автобус",
    emoji: "🚌",
    correct: true
  },

  {
    name: "Ананас",
    emoji: "🍍",
    correct: true
  },

  {
    name: "Мяч",
    emoji: "⚽",
    correct: false
  },

  {
    name: "Кот",
    emoji: "🐱",
    correct: false
  },

  {
    name: "Дом",
    emoji: "🏠",
    correct: false
  },

  {
    name: "Жук",
    emoji: "🐞",
    correct: false
  }

];

/* =====================================================
   РАЗМЕРЫ
===================================================== */

const WIDTH = 1920;
const HEIGHT = 1080;

const FISH_WIDTH = 245;
const FISH_HEIGHT = 160;

const LANES = [
  500,
  690,
  855
];

const BOAT_X = 625;
const BOAT_WIDTH = 670;

const WATER_Y = 390;

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
  document.getElementById(
    "game"
  );

const viewport =
  document.getElementById(
    "viewport"
  );

const boat =
  document.getElementById(
    "boat"
  );

const boy =
  document.getElementById(
    "boy"
  );

const rod =
  document.getElementById(
    "rod"
  );

const rodLight =
  document.getElementById(
    "rodLight"
  );

const rodHandle =
  document.getElementById(
    "rodHandle"
  );

const line =
  document.getElementById(
    "line"
  );

const hook =
  document.getElementById(
    "hook"
  );

const score =
  document.getElementById(
    "score"
  );

const progressFill =
  document.getElementById(
    "progressFill"
  );

const message =
  document.getElementById(
    "message"
  );

const finish =
  document.getElementById(
    "finish"
  );

const restart =
  document.getElementById(
    "restart"
  );

const total =

  CARDS.filter(
    card =>
      card.correct
  ).length;

/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let fishes = [];

let queue = [];

let caught = 0;

let action = null;

let previousTime = null;

let clock = 0;

let messageUntil = 0;

let boatHeight = 450;

let spawnNumber = 0;

/* =====================================================
   МАСШТАБ
===================================================== */

function resizeGame() {

  const scale =

    Math.min(

      document.documentElement.clientWidth /
      WIDTH,

      document.documentElement.clientHeight /
      HEIGHT

    );

  viewport.style.width =
    `${WIDTH * scale}px`;

  viewport.style.height =
    `${HEIGHT * scale}px`;

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   РАЗМЕР ЛОДКИ
===================================================== */

function measureBoat() {

  if (!boy.naturalWidth) {
    return;
  }

  boatHeight =

    BOAT_WIDTH *

    boy.naturalHeight /

    boy.naturalWidth;

  boat.style.height =
    `${boatHeight}px`;

}

boy.addEventListener(
  "load",
  measureBoat
);

if (boy.complete) {
  measureBoat();
}

/* =====================================================
   ВСПОМОГАТЕЛЬНЫЕ
===================================================== */

function shuffle(items) {

  const result =
    [...items];

  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {

    const j =

      Math.floor(

        Math.random() *
        (i + 1)

      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

function mix(
  a,
  b,
  t
) {

  return (
    a +
    (b - a) * t
  );

}

function smooth(t) {

  return (
    t *
    t *
    (3 - 2 * t)
  );

}

function updateScore() {

  score.textContent =
    `🐟 ${caught} / ${total}`;

  progressFill.style.width =

    `${
      total
        ? caught / total * 100
        : 0
    }%`;

}

function showMessage(
  text,
  seconds = 2.8
) {

  message.textContent =
    text;

  messageUntil =
    clock + seconds;

}

/* =====================================================
   ЛОДКА
===================================================== */

function getBoatPose() {

  const bob =

    Math.sin(
      clock * 1.5
    ) * 3;

  const top =

    WATER_Y -

    boatHeight * .72 +

    bob;

  boat.style.top =
    `${top}px`;

  boat.style.transform =

    `rotate(${
      Math.sin(
        clock * 1.25
      ) * .5
    }deg)`;

  /*
    УДОЧКА ПОДВИНУТА К РУКАМ МАЛЬЧИКА.
  */

  return {

    hand: {

      x:
        BOAT_X +
        BOAT_WIDTH * .585,

      y:
        top +
        boatHeight * .475

    },

    tip: {

      x:
        BOAT_X +
        BOAT_WIDTH * .585 +
        300,

      y:
        top +
        boatHeight * .475 -
        145

    },

    landing: {

      x:
        BOAT_X +
        BOAT_WIDTH * .70,

      y:
        top +
        boatHeight * .73

    }

  };

}

/* =====================================================
   УДОЧКА
===================================================== */

function drawRod(
  pose,
  bend = 0
) {

  const {
    hand,
    tip
  } = pose;

  const path = `

    M ${hand.x - 8}
      ${hand.y + 12}

    Q ${hand.x + 125}
      ${hand.y - 185}

      ${tip.x}
      ${tip.y + bend}

  `;

  rod.setAttribute(
    "d",
    path
  );

  rodLight.setAttribute(
    "d",
    path
  );

  rodHandle.setAttribute(
    "x1",
    hand.x - 12
  );

  rodHandle.setAttribute(
    "y1",
    hand.y + 18
  );

  rodHandle.setAttribute(
    "x2",
    hand.x + 8
  );

  rodHandle.setAttribute(
    "y2",
    hand.y - 11
  );

  return {

    x:
      tip.x,

    y:
      tip.y + bend

  };

}

function drawLine(
  tip,
  end,
  showHook = true
) {

  const curve =

    Math.min(

      30,

      Math.abs(
        end.y -
        tip.y
      ) * .08

    );

  line.setAttribute(

    "d",

    `

    M ${tip.x}
      ${tip.y}

    Q ${tip.x + curve}
      ${(tip.y + end.y) / 2}

      ${end.x}
      ${end.y}

    `

  );

  hook.style.display =

    showHook
      ? ""
      : "none";

  hook.setAttribute(

    "d",

    `

    M ${end.x}
      ${end.y - 24}

    L ${end.x}
      ${end.y - 8}

    Q ${end.x}
      ${end.y + 1}

      ${end.x - 8}
      ${end.y}

    Q ${end.x - 18}
      ${end.y - 1}

      ${end.x - 16}
      ${end.y - 12}

    L ${end.x - 11}
      ${end.y - 7}

    `

  );

}

/* =====================================================
   СОЗДАНИЕ НОВОЙ РЫБКИ
===================================================== */

function spawnFish(
  lane,
  initial = false
) {

  if (!queue.length) {
    return;
  }

  const card =
    queue.shift();

  const direction =

    spawnNumber++ % 2 === 0

      ? 1

      : -1;

  /*
    СЛУЧАЙНО ВЫБИРАЕМ
    ОДИН ИЗ ТРЁХ ВИДОВ.
  */

  const typeIndex =

    Math.floor(

      Math.random() *
      FISH_TYPES.length

    );

  const fishType =
    FISH_TYPES[typeIndex];

  const element =

    document.createElement(
      "button"
    );

  element.type =
    "button";

  element.className =

    `fish type-${typeIndex + 1}` +

    (
      direction === 1

        ? " right"

        : ""
    );

  element.setAttribute(
    "aria-label",
    card.name
  );

  /*
    ВАЖНО:
    никаких старых CSS-тел,
    глаз, ртов, плавников и хвостов.
  */

  element.innerHTML = `

    <span class="fish-art">

      <img
        class="fish-tail"
        src="${fishType.tail}"
        alt=""
        draggable="false"
      >

      <img
        class="fish-body"
        src="${fishType.body}"
        alt=""
        draggable="false"
      >

    </span>

    <span
      class="picture"
      aria-hidden="true"
    ></span>

  `;

  const picture =

    element.querySelector(
      ".picture"
    );

  picture.textContent =
    card.emoji;

  const initialPositions = [
    240,
    1230,
    700
  ];

  const fish = {

    card,

    element,

    lane,

    direction,

    typeIndex,

    x:
      initial

        ? initialPositions[lane]

        : direction === 1

          ? -FISH_WIDTH - 30

          : WIDTH + 30,

    y:
      LANES[lane],

    speed:
      78 +
      Math.random() * 24,

    phase:
      Math.random() *
      Math.PI * 2,

    boostUntil:
      0,

    removed:
      false

  };

  element.disabled =

    Boolean(action) ||
    !finish.hidden;

  element.addEventListener(

    "click",

    () =>
      selectFish(fish)

  );

  game.appendChild(
    element
  );

  fishes.push(
    fish
  );

  renderFish(
    fish
  );

}

/* =====================================================
   РЕНДЕР
===================================================== */

function renderFish(
  fish,
  scale = 1,
  rotation = 0
) {

  fish.element.style.transform = `

    translate(
      ${fish.x}px,
      ${fish.y}px
    )

    rotate(
      ${rotation}deg
    )

    scale(
      ${scale}
    )

  `;

}

function setFishEnabled(
  enabled
) {

  for (
    const fish
    of fishes
  ) {

    fish.element.disabled =
      !enabled;

  }

}

/* =====================================================
   ВЫБОР РЫБЫ
===================================================== */

function selectFish(
  fish
) {

  if (
    action ||
    fish.removed ||
    !finish.hidden
  ) {
    return;
  }

  if (
    !fish.card.correct
  ) {

    fish.element.classList.remove(
      "wrong"
    );

    void fish.element.offsetWidth;

    fish.element.classList.add(
      "wrong"
    );

    fish.boostUntil =
      clock + .55;

    showMessage(

      `«${fish.card.name}» — здесь нет звука С. Ищем другую рыбку!`

    );

    return;

  }

  action = {

    fish,

    stage:
      "lower",

    elapsed:
      0,

    startX:
      fish.x,

    startY:
      fish.y

  };

  fish.element.style.zIndex =
    "10";

  setFishEnabled(
    false
  );

  showMessage(

    `«${fish.card.name}» — есть звук С! Ловим!`,

    10

  );

}

/* =====================================================
   АНИМАЦИЯ ПОИМКИ
===================================================== */

function animateCatch(
  dt,
  pose
) {

  const current =
    action;

  const fish =
    current.fish;

  current.elapsed +=
    dt;

  if (
    current.stage ===
    "lower"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / .75,
          1
        )

      );

    const tip =
      drawRod(
        pose,
        t * 11
      );

    drawLine(

      tip,

      {

        x:
          mix(

            tip.x + 6,

            fish.x +
            FISH_WIDTH / 2,

            t

          ),

        y:
          mix(

            tip.y + 58,

            fish.y + 18,

            t

          )

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "lift";

      current.elapsed =
        0;

    }

    return;

  }

  if (
    current.stage ===
    "lift"
  ) {

    const t =

      smooth(

        Math.min(
          current.elapsed / 1.65,
          1
        )

      );

    const scale =
      1 - t * .35;

    fish.x =

      mix(

        current.startX,

        pose.landing.x -
        FISH_WIDTH / 2,

        t

      );

    fish.y =

      mix(

        current.startY,

        pose.landing.y -
        145,

        t

      );

    renderFish(
      fish,
      scale
    );

    const tip =

      drawRod(

        pose,

        11 +
        Math.sin(
          t * Math.PI
        ) * 12

      );

    drawLine(

      tip,

      {

        x:
          fish.x +
          FISH_WIDTH / 2,

        y:
          fish.y +
          18

      }

    );

    if (
      t >= 1
    ) {

      current.stage =
        "drop";

      current.elapsed =
        0;

      current.dropX =
        fish.x;

      current.dropY =
        fish.y;

      fish.element.style.zIndex =
        "6";

    }

    return;

  }

  const t =

    Math.min(
      current.elapsed / .6,
      1
    );

  fish.x =

    mix(

      current.dropX,

      pose.landing.x -
      FISH_WIDTH / 2,

      t

    );

  fish.y =

    mix(

      current.dropY,

      pose.landing.y -
      FISH_HEIGHT / 2 +
      31,

      t * t

    );

  renderFish(

    fish,

    .65 -
    t * .25,

    t * 12

  );

  fish.element.style.opacity =

    String(

      1 -

      Math.max(

        0,

        (t - .45) /
        .55

      )

    );

  const tip =
    drawRod(

      pose,

      (1 - t) *
      11

    );

  drawLine(

    tip,

    {

      x:
        tip.x + 6,

      y:
        tip.y + 58

    }

  );

  if (
    t >= 1
  ) {

    finishCatch(
      fish
    );

  }

}

/* =====================================================
   ПОЙМАНА
===================================================== */

function finishCatch(
  fish
) {

  fish.removed =
    true;

  fish.element.remove();

  fishes =

    fishes.filter(

      item =>
        item !== fish

    );

  caught++;

  updateScore();

  action =
    null;

  if (
    caught === total
  ) {

    setFishEnabled(
      false
    );

    finish.hidden =
      false;

    restart.focus();

    return;

  }

  spawnFish(
    fish.lane
  );

  setFishEnabled(
    true
  );

  showMessage(
    "Рыбка в лодке! Продолжаем рыбалку."
  );

}

/* =====================================================
   ДВИЖЕНИЕ
===================================================== */

function moveFishes(
  dt
) {

  for (
    const fish
    of [...fishes]
  ) {

    if (
      action &&
      action.fish === fish
    ) {
      continue;
    }

    const boost =

      clock <
      fish.boostUntil

        ? 2.2

        : 1;

    fish.x +=

      fish.direction *

      fish.speed *

      dt *

      boost;

    fish.y =

      LANES[fish.lane] +

      Math.sin(

        clock * 1.7 +

        fish.phase

      ) * 11;

    renderFish(
      fish
    );

    const outside =

      fish.direction === 1

        ? fish.x >
          WIDTH + 35

        : fish.x <
          -FISH_WIDTH - 35;

    if (
      outside
    ) {

      fish.removed =
        true;

      fish.element.remove();

      fishes =

        fishes.filter(

          item =>
            item !== fish

        );

      queue.push(
        fish.card
      );

      spawnFish(
        fish.lane
      );

    }

  }

}

/* =====================================================
   ЦИКЛ
===================================================== */

function frame(
  timestamp
) {

  const dt =

    previousTime === null

      ? 0

      : Math.min(

          (
            timestamp -
            previousTime
          ) / 1000,

          .05

        );

  previousTime =
    timestamp;

  if (
    finish.hidden &&
    !document.hidden
  ) {

    clock +=
      dt;

    const pose =
      getBoatPose();

    moveFishes(
      dt
    );

    if (
      action
    ) {

      animateCatch(
        dt,
        pose
      );

    } else {

      const tip =
        drawRod(
          pose
        );

      drawLine(

        tip,

        {

          x:
            tip.x +
            6 +
            Math.sin(
              clock * 1.8
            ) * 4,

          y:
            tip.y +
            58

        }

      );

    }

    if (
      !action &&
      clock >
      messageUntil
    ) {

      message.textContent =

        "Найди рыбку с картинкой, в названии которой есть звук С";

    }

  }

  requestAnimationFrame(
    frame
  );

}

document.addEventListener(

  "visibilitychange",

  () => {

    previousTime =
      null;

  }

);

/* =====================================================
   НОВАЯ ИГРА
===================================================== */

function resetGame() {

  for (
    const fish
    of fishes
  ) {

    fish.element.remove();

  }

  fishes =
    [];

  queue =
    shuffle(
      CARDS
    );

  caught =
    0;

  action =
    null;

  clock =
    0;

  previousTime =
    null;

  spawnNumber =
    0;

  finish.hidden =
    true;

  updateScore();

  for (
    let lane = 0;

    lane <
    LANES.length;

    lane++
  ) {

    spawnFish(
      lane,
      true
    );

  }

  const pose =
    getBoatPose();

  const tip =
    drawRod(
      pose
    );

  drawLine(

    tip,

    {

      x:
        tip.x + 6,

      y:
        tip.y + 58

    }

  );

  showMessage(

    "Нажми на рыбку с картинкой, в названии которой есть звук С",

    4

  );

}

restart.addEventListener(

  "click",

  resetGame

);

resetGame();

requestAnimationFrame(
  frame
);

</script>
